<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crumble">
<meta name="theme-color" content="#150B26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Crumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#FFD45C; --ink:#2A1444; --font:"Fredoka","Trebuchet MS",Verdana,system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#150B26}
  body{font-family:var(--font);touch-action:none;user-select:none;color:#fff}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .hud{position:absolute;top:0;left:0;right:0;height:calc(92px + env(safe-area-inset-top,0px));
       padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
       display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .lbl{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .score{font-size:38px;font-weight:700;line-height:1;margin-top:1px;
         text-shadow:0 0 18px rgba(255,212,92,.35)}
  .right{text-align:right;display:flex;gap:14px;align-items:flex-start}
  .best{font-size:20px;font-weight:700;line-height:1;margin-top:3px;color:var(--gold)}
  #mute,#devBtn{pointer-events:auto;background:rgba(255,255,255,.09);border:0;color:#fff;
        width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer}
  #dbg{position:absolute;left:18px;top:calc(64px + env(safe-area-inset-top,0px));font-size:11px;font-weight:600;letter-spacing:.06em;
       opacity:.6;pointer-events:none}
  #dbg[hidden]{display:none}
  #devPanel{justify-content:flex-start;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
  #devList{flex:1 1 auto;min-height:0;width:min(420px,100%);overflow-y:auto;text-align:left;touch-action:pan-y;
           display:flex;flex-direction:column;gap:12px;padding:0 4px}
  #devList .tog,#devList .head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
  #devList .tog{padding:6px 0}
  #devList .head output{color:var(--gold);font-variant-numeric:tabular-nums}
  #devList input[type=range]{width:100%;touch-action:pan-y;accent-color:var(--gold)}
  #devList input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
  .devbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .devbtns button{font-size:14px;padding:10px 18px;min-height:44px}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
        padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:16px;padding:28px;text-align:center;
           background:radial-gradient(120% 90% at 50% 40%,rgba(45,20,74,.78),rgba(12,6,22,.96));
           backdrop-filter:blur(5px)}
  .overlay[hidden]{display:none}
  .title{font-size:clamp(46px,15vw,78px);font-weight:700;line-height:.92;letter-spacing:-.03em;
         text-shadow:0 0 40px rgba(255,212,92,.3)}
  .title em{font-style:normal;color:var(--gold)}
  .sub{font-size:15px;font-weight:500;opacity:.82;max-width:26ch;line-height:1.5}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
  .big{font-size:clamp(56px,19vw,92px);font-weight:700;line-height:1;color:var(--gold);
       text-shadow:0 0 34px rgba(255,212,92,.4)}
  button.cta{font-family:var(--font);font-size:18px;font-weight:600;color:var(--ink);
        background:linear-gradient(#FFE07A,#FFC12E);border:0;border-radius:999px;padding:15px 34px;
        min-height:56px;cursor:pointer;box-shadow:0 5px 0 #C9941A,0 8px 24px rgba(255,193,46,.3);
        transition:transform .08s,box-shadow .08s}
  button.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #C9941A}
  button.ghost{background:transparent;color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.3);
        font-size:15px;padding:12px 26px;min-height:48px;border-radius:999px;font-family:var(--font);
        font-weight:600;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .styles{display:flex;gap:10px}
  .styles button{font-family:var(--font);font-size:14px;font-weight:600;color:#fff;
        background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
        border-radius:999px;padding:11px 24px;min-height:46px;cursor:pointer}
  .styles button[aria-pressed="true"]{background:rgba(255,212,92,.16);border-color:var(--gold);color:var(--gold)}

  #adScreen{background:#0B0713;gap:20px}
  .adbox{width:min(320px,86vw);aspect-ratio:4/3;border-radius:18px;display:flex;
         align-items:center;justify-content:center;font-size:13px;letter-spacing:.28em;
         font-weight:600;opacity:.45;border:2px dashed rgba(255,255,255,.26)}
  #adTimer{font-size:13px;opacity:.6;font-weight:600}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <div><div class="lbl">Score</div><div class="score" id="scoreVal">0</div></div>
    <div class="right">
      <div><div class="lbl">Best</div><div class="best" id="bestVal">0</div></div>
      <button id="devBtn" aria-label="Developer settings" hidden>⚙️</button>
      <button id="mute" aria-label="Toggle sound">🔊</button>
    </div>
  </div>
  <div id="dbg"></div>

  <div class="overlay" id="startCard">
    <h1 class="title">Crum<em>ble</em></h1>
    <p class="sub">Drag the three shapes onto the board. Fill a whole row or column and it clears. Empty the board for a clean sweep.</p>
    <div class="styles">
      <button id="styJewel" aria-pressed="true">Jewels</button>
      <button id="styClay" aria-pressed="false">Clay</button>
    </div>
    <button class="cta" id="startBtn">Play</button>
  </div>

  <div class="overlay" id="overCard" hidden>
    <p class="eyebrow">No room left</p>
    <p class="big" id="overScore">0</p>
    <p class="sub" id="overMsg"></p>
    <button class="cta" id="reviveBtn">Watch an ad to keep going</button>
    <button class="ghost" id="againBtn">Start over</button>
  </div>

  <div class="overlay" id="adScreen" hidden>
    <p class="eyebrow">Advertisement</p>
    <div class="adbox">YOUR AD HERE</div>
    <p id="adTimer">5</p>
    <button class="cta" id="adClose" disabled>Close</button>
  </div>

  <div class="overlay" id="devPanel" hidden>
    <p class="eyebrow">Developer settings · game paused</p>
    <div id="devList"></div>
    <div class="devbtns">
      <button class="ghost" id="devReset">Reset to defaults</button>
      <button class="ghost" id="devCopy">Copy settings</button>
      <button class="cta" id="devClose">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
/* ═══════════════════════════════════════════════════════════════
   TUNE THESE
   ═══════════════════════════════════════════════════════════════ */
const CFG = {
  GRID: 8,
  DEV_MODE: true,        // shows the gear + developer panel; set false before release (also ignores saved panel overrides)
  SNAP_RADIUS:   1,      // cells searched around the nearest grid spot (per axis) when it isn't valid
  SNAP_STICKY:   0.6,    // a shown ghost is kept until the piece drifts this many cells from it
  SNAP_GRACE:    150,    // ms after a ghost vanishes that releasing still places it
  STYLE: 'jewel',        // 'jewel' or 'clay' — also switchable on the start screen

  // difficulty wave
  TENSION_UP:    0.18,   // added each placement that clears nothing
  TENSION_DRIFT: 0.07,   // extra rise when the board is getting cramped
  TENSION_DOWN:  0.18,   // subtracted when you clear (softer = help lingers longer)
  CANDIDATES:    36,   // random hands tried per tray before settling
  NODE_BUDGET:   2600,   // search cap per hand (raise = smarter, slower)
  SWEEP_COOLDOWN: 3,    // trays that must pass before another sweep hand
  SINGLE_WEIGHT: 0.35,   // multiplier on the 1-cell piece (density bias otherwise floods the tray with them)
  EARLY_TRAYS:   4,      // opening trays that favor stackable pieces (bars and rectangles)
  EARLY_AWKWARD: 0.15,   // weight multiplier for non-rectangles during those trays
  PAIR_CHANCE:   0.7,    // odds a tray carries a partner for an awkward piece (L/J/T/S/Z) from the previous tray
  TIDY:          2.0,    // how much hand choice favors a compact board (0 = ignore; higher = flatter, fewer holes)
  SWEEP_MIN: 6, SWEEP_MAX: 30,  // gem count range where a sweep is plausible

  // scoring
  LINE_POINTS: 10, COMBO_STEP: 0.5,
  SWEEP_BONUS: 300, SWEEP_PER_GEM: 25,

  // golden hand: a bonus tray that pays a multiplier if she finds its planned clear
  GOLDEN_CHANCE:   0.05, // random roll after a tray when tension > 0.5 (a clean sweep or combo >= 3 always qualifies)
  GOLDEN_COOLDOWN: 4,    // trays that must pass before another golden hand
  GOLDEN_MULT:     3,    // multiplier on the points earned by the three golden placements

  FREE_RESCUES: 1,       // rescues every run starts with (first one is never behind an ad)
  MAX_RESCUES: 2,        // most rescues one run can use
  RESCUE_FLOOR: 300,     // offer a rescue only above this score...
  RESCUE_BEST_FRAC: 0.5, // ...or above this fraction of her best
  ADS_EVERY: 3,
  SHARDS: 8, SHAKE: 1.0, SPARKLE_RATE: 620,
  // star gem: a single-cell piece that clears its whole row and column
  STAR_ENABLED:  true,   // master switch for star gems
  STAR_CHANCE:   0.08,   // odds each tray carries one, replacing a normal piece
  STAR_COMBO:    4,      // a combo this high (or higher) guarantees one in the next normal tray

  GOLDEN_ON:     true,   // master switch for golden hands

  LIFT:          1.55,   // how far above the finger a dragged piece floats, in cells
  SMALL_BIAS:    3.0,    // density bias in weightedShape: higher = fewer big pieces as the board fills
  TIER_SOLVABLE: 0.05,   // tension above this deals 'solvable' hands (2+ lines)
  TIER_JACKPOT:  0.25,   // ...above this 'jackpot' hands (3+ lines)
  TIER_SWEEP:    0.70,   // ...above this a planned clean sweep (when off cooldown)

  SHOW_TENSION: true     // set false to hide the debug readout
};

const GEMS=[
  {h:344,s:88},{h: 32,s:96},{h:150,s:72},
  {h:188,s:85},{h:226,s:88},{h:278,s:82},
  {h: 47,s:100,gold:true},                // golden hands only — never dealt in a normal tray
  {h:255,s:30,star:true}                  // star gem only
];
const GOLD=6, STAR_GI=7, NCOLOR=6;        // NCOLOR = the ordinary colours dealt at random

/* ═══════ ADS — the only ad code in the file ═══════ */
const Ads = {
  isReady(){ return true; },
  async showInterstitial(){ await fakeAd(5); },
  async showRewarded(){ await fakeAd(8); return true; }
};
function el(id){ return document.getElementById(id); }
const adScreen=el('adScreen'), adTimer=el('adTimer'), adClose=el('adClose');
function fakeAd(secs){
  return new Promise(res=>{
    let left=secs;
    adScreen.hidden=false; adTimer.textContent=left; adClose.disabled=true;
    const t=setInterval(()=>{ left--; adTimer.textContent=left>0?left:'';
      if(left<=0){ clearInterval(t); adClose.disabled=false; } },1000);
    adClose.onclick=()=>{ clearInterval(t); adScreen.hidden=true; res(); };
  });
}

/* ═══════ shapes ═══════ */
const RAW=[
  ['X'],['XX'],['X','X'],['XXX'],['X','X','X'],['XXXX'],['X','X','X','X'],
  ['XXXXX'],['X','X','X','X','X'],['XX','XX'],['XXX','XXX','XXX'],
  ['XX','X.'],['XX','.X'],['X.','XX'],['.X','XX'],
  ['X..','X..','XXX'],['XXX','X..','X..'],['XXX','..X','..X'],['..X','..X','XXX'],
  ['.XX','XX.'],['XX.','.XX'],['X.','XX','.X'],['.X','XX','X.'],
  ['XXX','.X.'],['.X.','XXX'],['X.','XX','X.'],['.X','XX','.X'],
  ['X.','X.','XX'],['XXX','X..'],['XX','.X','.X'],['..X','XXX'],   // L, 4 angles
  ['.X','.X','XX'],['X..','XXX'],['XX','X.','X.'],['XXX','..X'],   // J, 4 angles
  ['XXX','XXX'],['XX','XX','XX']
];
const SHAPES=RAW.map(rows=>{
  const cells=[];
  rows.forEach((r,ri)=>[...r].forEach((ch,ci)=>{ if(ch==='X') cells.push([ri,ci]); }));
  return {cells,rows:rows.length,cols:rows[0].length,n:cells.length};
});

// star gem: one cell, but it doesn't rest on the board — it clears its row and column instead
const STAR={cells:[[0,0]],rows:1,cols:1,n:1,star:true};

/* ═══════ state ═══════ */
const cvs=el('c'), ctx=cvs.getContext('2d'), safeProbe=el('safe');
const N=CFG.GRID;
let W,H,dpr,cell,B,bx,by,trayY,trayH,trayCell;
let grid,tray,score=0,best=0,combo=0,rescues=0,rescuesUsed=0,deaths=0;
let tension=0, sweepCool=0, lastTier='—', trayNo=0;
let starForced=false;   // a big combo guaranteed the next normal tray a star gem
let golden=null, goldenNext=false, goldenCool=0, trayHadSweep=false, trayCombo=0;   // golden = live hand: {want,got,pts}
let shatters=[],shards=[],pops=[],sweeps=[],waves=[],sparkles=[],banners=[],blasts=[];
let paused=false;
let shake=0,glowT=0,glowH=280,drag=null,ret=null,state='idle',lastSpark=0;
let gemBig=[],gemSmall=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

/* ═══════════════════════════════════════════════════════════════
   THE SOLVER
   The board is packed into a flat Uint8Array for speed. evalHand
   tries all six orderings of the three pieces and every legal
   position, APPLYING CLEARS BETWEEN PLACEMENTS — so a hand where
   piece 1 must clear a row before piece 2 has anywhere to go is
   found as a valid line. Capped by a node budget so it can never
   stall a frame.
   ═══════════════════════════════════════════════════════════════ */
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

function packGrid(g){
  const a=new Uint8Array(N*N);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) a[r*N+c]=g[r][c]?1:0;
  return a;
}
function fitFlat(a,s,r,c){
  if(r<0||c<0||r+s.rows>N||c+s.cols>N) return false;
  for(const [dr,dc] of s.cells) if(a[(r+dr)*N+c+dc]) return false;
  return true;
}
function applyFlat(a,s,r,c){
  const b=a.slice();
  if(s.star){                                   // star: wipes its row and column; each counts as a line if it held a gem
    let rowHas=0,colHas=0;
    for(let j=0;j<N;j++) if(b[r*N+j]) rowHas=1;
    for(let i=0;i<N;i++) if(b[i*N+c]) colHas=1;
    for(let j=0;j<N;j++) b[r*N+j]=0;
    for(let i=0;i<N;i++) b[i*N+c]=0;
    return {b,lines:rowHas+colHas};
  }
  for(const [dr,dc] of s.cells) b[(r+dr)*N+c+dc]=1;
  const rows=[],cols=[];
  for(let i=0;i<N;i++){let f=1;for(let j=0;j<N;j++) if(!b[i*N+j]){f=0;break;} if(f)rows.push(i);}
  for(let j=0;j<N;j++){let f=1;for(let i=0;i<N;i++) if(!b[i*N+j]){f=0;break;} if(f)cols.push(j);}
  for(const i of rows) for(let j=0;j<N;j++) b[i*N+j]=0;
  for(const j of cols) for(let i=0;i<N;i++) b[i*N+j]=0;
  return {b,lines:rows.length+cols.length};
}
// edges between filled and empty cells: low = compact block, high = ragged/holey
function roughFlat(a){
  let n=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c;
    if(c<N-1&&a[i]!==a[i+1]) n++;
    if(r<N-1&&a[i]!==a[i+N]) n++;
  }
  return n;
}
const emptyFlat=a=>{ for(let i=0;i<a.length;i++) if(a[i]) return false; return true; };
const countFlat=a=>{ let n=0; for(let i=0;i<a.length;i++) if(a[i]) n++; return n; };

function evalHand(a0,shapes,budget){
  const res={ok:false,lines:0,sweep:false,cleared:0,rough:999};
  const base=countFlat(a0)+shapes.reduce((n,s)=>n+(s.star?0:s.n),0);   // a star adds no gem to the board
  let b=budget;
  function dfs(a,order,i,acc){
    if(b<=0||res.sweep) return;
    if(i===3){
      res.ok=true; if(acc>res.lines) res.lines=acc;
      const cl=base-countFlat(a); if(cl>res.cleared) res.cleared=cl;
      const rg=roughFlat(a); if(rg<res.rough) res.rough=rg;
      return;
    }
    const s=shapes[order[i]];
    for(let r=0;r<=N-s.rows;r++) for(let c=0;c<=N-s.cols;c++){
      if(b<=0||res.sweep) return;
      if(!fitFlat(a,s,r,c)) continue;
      b--;
      const {b:a2,lines}=applyFlat(a,s,r,c);
      if(lines&&emptyFlat(a2)){
        res.sweep=true; res.ok=true; res.cleared=base; res.rough=0; res.lines=Math.max(res.lines,acc+lines); return;
      }
      dfs(a2,order,i+1,acc+lines);
    }
  }
  for(const p of PERMS){ dfs(a0,p,0,0); if(res.sweep) break; }
  return res;
}

/* ── clean-sweep planner ───────────────────────────────────────
   Random hands almost never produce a sweep, so build one
   backwards: pick a set of rows/columns that covers every gem on
   the board, take their empty cells as a target, and try to tile
   that target exactly with up to three shapes. Then verify with
   the real solver before serving it.                            */
function coverAll(a,useRows,useCols){
  const occ=[]; for(let i=0;i<a.length;i++) if(a[i]) occ.push(i);
  const rows=new Set(), cols=new Set(), left=new Set(occ);
  while(left.size){
    let bestK=null,bestN=-1,bestIsRow=true;
    if(useRows) for(let r=0;r<N;r++){
      if(rows.has(r)) continue;
      let n=0; for(const i of left) if(((i/N)|0)===r) n++;
      if(n>bestN){bestN=n;bestK=r;bestIsRow=true;}
    }
    if(useCols) for(let c=0;c<N;c++){
      if(cols.has(c)) continue;
      let n=0; for(const i of left) if(i%N===c) n++;
      if(n>bestN){bestN=n;bestK=c;bestIsRow=false;}
    }
    if(bestK===null||bestN<=0) return null;
    if(bestIsRow){ rows.add(bestK); for(const i of [...left]) if(((i/N)|0)===bestK) left.delete(i); }
    else { cols.add(bestK); for(const i of [...left]) if(i%N===bestK) left.delete(i); }
  }
  return {rows:[...rows],cols:[...cols]};
}
function targetCells(a,cov){
  const T=new Set();
  cov.rows.forEach(r=>{ for(let c=0;c<N;c++) if(!a[r*N+c]) T.add(r*N+c); });
  cov.cols.forEach(c=>{ for(let r=0;r<N;r++) if(!a[r*N+c]) T.add(r*N+c); });
  return [...T];
}
function tileExact(T){
  const pool=SHAPES.slice().sort(()=>Math.random()-0.5);
  const out=[];
  function rec(rem){
    if(rem.size===0) return true;
    if(out.length>=3) return false;
    let first=Infinity; for(const v of rem) if(v<first) first=v;
    const fr=(first/N)|0, fc=first%N;
    for(const s of pool){
      for(const [dr,dc] of s.cells){
        const r=fr-dr, c=fc-dc;
        if(r<0||c<0||r+s.rows>N||c+s.cols>N) continue;
        const idx=[]; let ok=true;
        for(const [ar,ac] of s.cells){
          const id=(r+ar)*N+(c+ac);
          if(!rem.has(id)){ ok=false; break; }
          idx.push(id);
        }
        if(!ok) continue;
        idx.forEach(i=>rem.delete(i)); out.push(s);
        if(rec(rem)) return true;
        out.pop(); idx.forEach(i=>rem.add(i));
      }
    }
    return false;
  }
  return rec(new Set(T)) ? out.slice() : null;
}
function planSweep(a){
  const n=countFlat(a);
  if(n<CFG.SWEEP_MIN||n>CFG.SWEEP_MAX) return null;
  for(const [ur,uc] of [[true,true],[true,false],[false,true]]){
    const cov=coverAll(a,ur,uc); if(!cov) continue;
    const T=targetCells(a,cov);
    if(!T.length||T.length>15) continue;
    const tiles=tileExact(T); if(!tiles) continue;
    const hand=tiles.slice(0,3);
    while(hand.length<3) hand.push(SHAPES[(Math.random()*4)|0]);
    if(evalHand(a,hand,6000).sweep) return hand;
  }
  return null;
}

/* ── hand selection ─────────────────────────────────────────── */
const stackable=s=>s.n===s.rows*s.cols && s.n<=6;   // bars and small rectangles
/* partners: for each piece, the shapes that sit against it to form a
   solid 2-4 wide block (at most one hole, which a single fills) */
function pairHoles(A,B){
  let best=null;
  for(let dr=-4;dr<=4;dr++) for(let dc=-4;dc<=4;dc++){
    const set=new Set(); let ok=true;
    for(const [r,c] of A.cells) set.add(r+','+c);
    for(const [r,c] of B.cells){ const k=(r+dr)+','+(c+dc); if(set.has(k)){ok=false;break;} set.add(k); }
    if(!ok) continue;
    let r0=9,r1=-9,c0=9,c1=-9;
    for(const k of set){ const [r,c]=k.split(',').map(Number); r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c); }
    const h=r1-r0+1, w=c1-c0+1, holes=h*w-set.size;
    if(h>=2&&w>=2&&h<=4&&w<=4&&holes<=1&&(best===null||holes<best)) best=holes;
  }
  return best;
}
const PARTNERS=new Map();
SHAPES.forEach(A=>{ if(!stackable(A)) PARTNERS.set(A,SHAPES.filter(B=>B.n>1&&pairHoles(A,B)!==null)); });
let carry=[];   // awkward pieces from the last tray, whose partners should show up next
function makeHand(density){
  const h=[weightedShape(density),weightedShape(density),weightedShape(density)];
  if(carry.length && Math.random()<CFG.PAIR_CHANCE){
    const ps=PARTNERS.get(carry[(Math.random()*carry.length)|0]);
    if(ps&&ps.length) h[(Math.random()*3)|0]=ps[(Math.random()*ps.length)|0];
  }
  return h;
}
function weightedShape(density){
  const early=trayNo<=CFG.EARLY_TRAYS;
  const w=SHAPES.map(s=>(1/(1+s.n*density*CFG.SMALL_BIAS))*(s.n===1?CFG.SINGLE_WEIGHT:1)
    *(early&&!stackable(s)?CFG.EARLY_AWKWARD:1));
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let i=0;i<SHAPES.length;i++){ r-=w[i]; if(r<=0) return SHAPES[i]; }
  return SHAPES[0];
}
function pickTier(a){
  if(tension>CFG.TIER_SWEEP && sweepCool<=0) return 'sweep';
  if(tension>CFG.TIER_JACKPOT) return 'jackpot';
  if(tension>CFG.TIER_SOLVABLE) return 'solvable';
  return 'honest';
}
/* the candidate search: the best-scoring playable hand for a tier, plus its solver result */
function pickHand(a0,density,tier,withStar){
  const want = tier==='jackpot'?3 : tier==='solvable'?2 : 0;
  let bestHand=null,bestEv=null,bestScore=-Infinity,bestRough=999;
  for(let i=0;i<CFG.CANDIDATES;i++){
    const hand=makeHand(density);
    if(withStar) hand[(Math.random()*3)|0]=STAR;      // graded with the star in it, so the score is honest
    const ev=evalHand(a0,hand,CFG.NODE_BUDGET);
    let sc;
    if(!ev.ok) sc=-100+ev.lines;                      // all three must be playable
    else if(tier==='honest') sc=10-CFG.TIDY*ev.rough;   // any playable hand, prefer the tidiest
    else sc=(ev.sweep?60:0)+ev.lines*10+ev.cleared*1.5-CFG.TIDY*ev.rough;
    if(sc>bestScore){ bestScore=sc; bestHand=hand; bestEv=ev; }
    if(ev.ok && i>=7 && tier!=='honest' && ev.lines>=want && ev.rough<=bestRough) break;
    if(ev.ok && ev.rough<bestRough) bestRough=ev.rough;
  }
  if(!bestHand){ bestHand=[weightedShape(density),weightedShape(density),weightedShape(density)]; bestEv=null; }
  return {hand:bestHand,ev:bestEv};
}
/* golden hand: a planned sweep if one can be built, else the best jackpot hand.
   Returns false (and deals nothing) if neither offers a real clear. */
function genGolden(a0,density){
  let hand=planSweep(a0), ev=hand&&evalHand(a0,hand,6000);
  if(hand&&ev.sweep){ sweepCool=CFG.SWEEP_COOLDOWN; tension=0.5; }   // same bookkeeping as a normal sweep hand
  else ({hand,ev}=pickHand(a0,density,'jackpot'));
  if(!ev||!ev.ok||(!ev.sweep&&ev.lines<1)) return false;
  commitTray(hand,'GOLDEN·'+(ev.sweep?'SWEEP':'JACKPOT'),{sweep:ev.sweep,lines:ev.lines});
  return true;
}
function genTray(){
  trayNo++;
  const a0=packGrid(grid);
  const density=countFlat(a0)/(N*N);
  let tier=pickTier(a0);
  sweepCool=Math.max(0,sweepCool-1);
  goldenCool=Math.max(0,goldenCool-1);

  // a star is dealt on ordinary trays only; a golden or sweep tray leaves a guaranteed one waiting
  const wantStar=CFG.STAR_ENABLED && (starForced || Math.random()<CFG.STAR_CHANCE);

  if(goldenNext){ goldenNext=false; if(genGolden(a0,density)) return; }

  if(tier==='sweep'){
    const h=planSweep(a0);
    if(h){ commitTray(h,'SWEEP'); sweepCool=CFG.SWEEP_COOLDOWN; tension=0.5; return; }
    tier='jackpot';
  }

  const {hand}=pickHand(a0,density,tier,wantStar);
  if(hand.includes(STAR)) starForced=false;
  commitTray(hand,tier.toUpperCase()+(hand.includes(STAR)?'+STAR':''));
}
/* rescue hand: playable, and rich in clears (sweep if one can be built) */
function genRescue(){
  const a0=packGrid(grid);
  const density=countFlat(a0)/(N*N);
  const sw=planSweep(a0);
  if(sw){ commitTray(sw,'RESCUE·SWEEP'); return; }
  let bestHand=null,bestScore=-Infinity;
  for(let i=0;i<CFG.CANDIDATES*8;i++){
    const hand=[weightedShape(density),weightedShape(density),weightedShape(density)];
    const ev=evalHand(a0,hand,CFG.NODE_BUDGET);
    const sc=ev.ok ? 100+(ev.sweep?60:0)+ev.lines*10
                   : hand.filter(s=>fitsAnywhere(s,grid)).length;
    if(sc>bestScore){ bestScore=sc; bestHand=hand; }
    if(ev.ok && ev.lines>=2) break;
  }
  commitTray(bestHand,'RESCUE');
}
function pushBanner(txt,sub){   // waits its turn if another banner is still on screen
  banners.push({t:banners.length?-0.75:0,txt,sub});
}
function commitTray(shapes,label,plan){
  tray=shapes.map(s=>({s,gi:s.star?STAR_GI:plan?GOLD:(Math.random()*NCOLOR)|0}));
  golden=plan?{want:plan,got:{lines:0,sweep:false},pts:0}:null;
  if(plan){
    goldenCool=CFG.GOLDEN_COOLDOWN;
    pushBanner('GOLDEN HAND','×'+CFG.GOLDEN_MULT+' if you find it');
    Sfx.goldenIn();
  }
  lastTier=label;
  carry=shapes.filter(x=>!stackable(x));
  updateDbg();
}
function updateDbg(){
  const d=el('dbg');
  d.hidden=!CFG.SHOW_TENSION;
  if(d.hidden) return;
  const tag=g=>g.sweep?'sweep':g.lines+' lines';
  const gold=golden?`GOLDEN want ${tag(golden.want)}, got ${tag(golden.got)}, ${golden.pts} pts`
    :goldenNext?'gold queued':goldenCool>0?`gold cooldown ${goldenCool}`:'gold ready';
  const star=!CFG.STAR_ENABLED?'star off':starForced?'star guaranteed':'star on';
  d.textContent=`tension ${tension.toFixed(2)} · ${lastTier} · ${gold} · ${star}`;
}

/* ═══════ layout + tiles ═══════ */
function roundPath(x,px,py,w,h,r){
  const k=Math.min(r,w/2,h/2);
  x.beginPath(); x.moveTo(px+k,py);
  x.arcTo(px+w,py,px+w,py+h,k); x.arcTo(px+w,py+h,px,py+h,k);
  x.arcTo(px,py+h,px,py,k); x.arcTo(px,py,px+w,py,k); x.closePath();
}
function newTile(size){
  const cv=document.createElement('canvas');
  const px=Math.max(10,Math.round(size*dpr));
  cv.width=cv.height=px;
  const x=cv.getContext('2d'); x.scale(px/size,px/size);
  return {cv,x};
}
// prismatic five-point star, used by the star gem (shiny outline in jewel, none in clay)
function drawStar(x,cx,cy,R,shiny){
  x.beginPath();
  for(let k=0;k<10;k++){
    const a=-Math.PI/2+k*Math.PI/5, rad=k%2?R*0.46:R;
    k?x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):x.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  x.closePath();
  const gr=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  ['#FF8FB8','#FFD98A','#9CF0B5','#8FD8FF','#B79CFF'].forEach((c,k,a)=>gr.addColorStop(k/(a.length-1),c));
  x.fillStyle=gr; x.fill();
  x.lineJoin='round'; x.lineWidth=Math.max(1,R*0.12);
  x.strokeStyle=shiny?'rgba(255,255,255,.95)':'rgba(120,90,170,.3)'; x.stroke();
}
// Hard facets: lit top, shadowed bottom, angled sides, specular.
function jewelTile(size,g){
  const {cv,x}=newTile(size);
  const L=g.star?d=>`hsl(${g.h} ${g.s}% ${clamp(90+d*.5,40,99)}%)`     // near-white, facets kept subtle
                 :d=>`hsl(${g.h} ${g.s}% ${clamp(57+d,5,96)}%)`;
  const pad=size*0.055, S=size-pad*2, i=S*0.25;
  const o=[[pad,pad],[pad+S,pad],[pad+S,pad+S],[pad,pad+S]];
  const n=[[pad+i,pad+i],[pad+S-i,pad+i],[pad+S-i,pad+S-i],[pad+i,pad+S-i]];
  x.save(); roundPath(x,pad,pad,S,S,S*0.25); x.clip();
  x.fillStyle=L(0); x.fillRect(pad,pad,S,S);
  const face=(a,b,c,d,dl)=>{ x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]);
    x.lineTo(c[0],c[1]); x.lineTo(d[0],d[1]); x.closePath(); x.fillStyle=L(dl); x.fill(); };
  face(o[0],o[1],n[1],n[0],24); face(o[3],o[0],n[0],n[3],7);
  face(o[1],o[2],n[2],n[1],-13); face(o[2],o[3],n[3],n[2],-27);
  const gr=x.createLinearGradient(n[0][0],n[0][1],n[2][0],n[2][1]);
  gr.addColorStop(0,L(18)); gr.addColorStop(1,L(-5));
  x.fillStyle=gr; x.fillRect(n[0][0],n[0][1],S-i*2,S-i*2);
  if(g.star) drawStar(x,size/2,size/2,S*0.4,true);
  x.globalAlpha=g.gold?.8:.5; x.fillStyle='#fff';
  roundPath(x,pad+S*0.3,pad+S*0.29,S*0.22,S*0.13,S*0.065); x.fill();
  x.globalAlpha=1; x.restore();
  roundPath(x,pad,pad,S,S,S*0.25);
  x.strokeStyle=L(26); x.lineWidth=Math.max(1,size*0.035); x.stroke();
  return cv;
}
// Matte, fat corners, soft shadow underneath — no shine anywhere.
function clayTile(size,g){
  const {cv,x}=newTile(size);
  const L=d=>`hsl(${g.h} ${Math.round(g.s*(g.gold?0.92:0.6))}% ${clamp((g.star?90:61)+d,8,96)}%)`;
  const pad=size*0.1, S=size-pad*2, R=S*0.34;
  x.save();
  x.shadowColor=`hsla(${g.h} 55% 16% / .5)`;
  x.shadowBlur=size*0.14; x.shadowOffsetY=size*0.06;
  roundPath(x,pad,pad,S,S,R); x.fillStyle=L(0); x.fill();
  x.restore();
  x.save(); roundPath(x,pad,pad,S,S,R); x.clip();
  const gr=x.createLinearGradient(0,pad,0,pad+S);
  gr.addColorStop(0,L(12)); gr.addColorStop(.58,L(0)); gr.addColorStop(1,L(-10));
  x.fillStyle=gr; x.fillRect(pad,pad,S,S);
  if(g.star) drawStar(x,size/2,size/2,S*0.4,false);
  x.globalAlpha=.16; x.fillStyle='#fff';
  roundPath(x,pad+S*0.12,pad+S*0.1,S*0.76,S*0.22,S*0.11); x.fill();
  x.globalAlpha=1; x.restore();
  return cv;
}
function buildCache(){
  const f=CFG.STYLE==='clay'?clayTile:jewelTile;
  gemBig=GEMS.map(g=>f(cell,g));
  gemSmall=GEMS.map(g=>f(trayCell,g));
}
function layout(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=cvs.clientWidth; H=cvs.clientHeight;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(safeProbe);
  const insetT=parseFloat(cs.paddingTop)||0, insetB=parseFloat(cs.paddingBottom)||0;
  const HUD=92+insetT, Hb=H-insetB;
  B=Math.min(W-26,Hb-HUD-190,520);
  cell=B/N; bx=(W-B)/2;
  by=HUD+Math.max(8,(Hb-HUD-B-cell*2.6-24)*0.34);
  trayH=cell*2.4;
  trayY=by+B+Math.max(16,(Hb-by-B-trayH-14)*0.5);
  trayCell=cell*0.56;
  buildCache();
}
addEventListener('resize',layout);

/* ═══════ audio ═══════
   Fully synthesized. Chain: voices -> master gain -> compressor -> out,
   so stacked sounds (a sweep on top of a combo) don't clip. One shared
   noise buffer is built when the context is created (first user gesture,
   which browsers require) and reused by every noise hit.
   ═══════════════════════════════════════════════════════════════ */
let actx=null,muted=false,master=null,nbuf=null;
function ac(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=.9;
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=6;
    comp.attack.value=.003; comp.release.value=.2;
    master.connect(comp); comp.connect(actx.destination);
    const len=actx.sampleRate;                       // 1s of white noise
    nbuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=nbuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
const jit=()=>1+(Math.random()*.06-.03);            // ±3% pitch per trigger
const hz=f=>clamp(f,20,12000);

/* filtered noise slice with its own envelope; f0 -> f1 sweeps the filter.
   Used both as the attack transient on every sound and as bursts/washes. */
function noiseHit(t,{dur=.012,f0=3000,f1=f0,q=1,vol=.1,type='bandpass'}){
  const c=actx, src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=nbuf; f.type=type; f.Q.value=q;
  f.frequency.setValueAtTime(hz(f0),t);
  if(f1!==f0) f.frequency.exponentialRampToValueAtTime(hz(f1),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.004,dur/3));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t,Math.random()*(nbuf.duration-dur-.05)); src.stop(t+dur+.01);
}
/* 2-3 detuned oscillators with a pitch envelope (f0 -> f1), through a
   resonant bandpass whose centre also sweeps (bp0 -> bp1). */
function voice(t,{f0,f1=f0,dur,vol,bp0,bp1=bp0,q=4,type='sawtooth',det=[-8,0,8],atk=.005}){
  const c=actx, out=c.createGain(), bp=c.createBiquadFilter();
  bp.type='bandpass'; bp.Q.value=q;
  bp.frequency.setValueAtTime(hz(bp0),t);
  bp.frequency.exponentialRampToValueAtTime(hz(bp1),t+dur);
  out.gain.setValueAtTime(.0001,t);
  out.gain.exponentialRampToValueAtTime(vol/det.length,t+atk);
  out.gain.exponentialRampToValueAtTime(.0001,t+dur);
  bp.connect(out); out.connect(master);
  for(const cents of det){
    const o=c.createOscillator();
    o.type=type; o.detune.value=cents;
    o.frequency.setValueAtTime(hz(f0),t);
    o.frequency.exponentialRampToValueAtTime(hz(f1),t+dur);
    o.connect(bp); o.start(t); o.stop(t+dur+.02);
  }
}
/* run a sound: skip when muted, start the clock at `delay`, never throw */
function play(delay,fn){
  if(muted) return;
  try{ const c=ac(); fn(c.currentTime+delay,jit()); }catch(e){}
}

    const top=523*p*2.5;
    [1,1.25,1.5,2].forEach(m=>voice(t+.55,{f0:top*m/2,f1:top*m/2,dur:1.2,vol:.08,bp0:top*m,bp1:top*m*3,q:3,det:[-12,0,12]}));
    for(let i=0;i<9;i++) noiseHit(t+.5+i*.08,{dur:.05,f0:(6000+Math.random()*5000)*p,q:10,vol:.05});
  }); },
  rescue(){ play(0,(t,p)=>{
    noiseHit(t,{dur:.012,f0:4000*p,q:1,vol:.06});
    [523,659,784].forEach((f,i)=>voice(t+i*.07,{f0:f*p,f1:f*p*1.03,dur:i===2?.35:.2,vol:.12,bp0:f*p*2,bp1:f*p*5,q:4,type:'triangle'}));
  }); }
};
el('mute').onclick=e=>{e.stopPropagation();muted=!muted;el('mute').textContent=muted?'🔈':'🔊';};

/* ═══════ game logic ═══════ */
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
function canPlace(s,r,c,g){
  if(r<0||c<0||r+s.rows>N||c+s.cols>N) return false;
  for(const [dr,dc] of s.cells) if(g[r+dr][c+dc]) return false;
  return true;
}
function fitsAnywhere(s,g){
  for(let r=0;r<=N-s.rows;r++) for(let c=0;c<=N-s.cols;c++) if(canPlace(s,r,c,g)) return true;
  return false;
}
function linesFor(g){
  const rows=[],cols=[];
  for(let r=0;r<N;r++) if(g[r].every(v=>v)) rows.push(r);
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++) if(!g[r][c]){f=false;break;} if(f) cols.push(c);}
  return {rows,cols};
}
function mobility(){
  let n=0; for(const s of SHAPES) if(fitsAnywhere(s,grid)) n++;
  return n/SHAPES.length;
}

function place(idx,r,c){
  const t=tray[idx],s=t.s;
  if(!s.star) s.cells.forEach(([dr,dc],k)=>{ grid[r+dr][c+dc]={gi:t.gi,t:-k*0.06}; });   // a star leaves no gem
  tray[idx]=null;
  if(!s.star) Sfx.place();

  let rows,cols;
  if(s.star){                                     // its whole row and column, full or not (each counts if it held a gem)
    rows=grid[r].some(v=>v)?[r]:[];
    cols=grid.some(row=>row[c])?[c]:[];
  } else ({rows,cols}=linesFor(grid));
  const total=rows.length+cols.length;
  let gained=s.n, swept=false;

  if(s.star){
    blasts.push({r,c,t:0});
    waves.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,t:0});
    for(let k=0;!reduce&&k<10;k++){
      const along=Math.random()*B, onRow=k%2===0;
      sparkles.push({x:onRow?bx+along:bx+(c+.5)*cell,y:onRow?by+(r+.5)*cell:by+along,t:Math.random()*0.5});
    }
    Sfx.star();
  }

  if(total>0){
    combo++; trayCombo=Math.max(trayCombo,combo);
    if(CFG.STAR_ENABLED && combo>=CFG.STAR_COMBO) starForced=true;
    gained+=Math.round(CFG.LINE_POINTS*total*total*(1+(combo-1)*CFG.COMBO_STEP));
    if(!s.star){                                   // a star gets its own cross-shaped blast instead
      rows.forEach(r2=>sweeps.push({horiz:true,idx:r2,t:0}));
      cols.forEach(c2=>sweeps.push({horiz:false,idx:c2,t:0}));
    }

    const marked=new Map();
    rows.forEach(r2=>{for(let i=0;i<N;i++) marked.set(r2+','+i,i);});
    cols.forEach(c2=>{for(let i=0;i<N;i++) marked.set(i+','+c2,i);});
    let lastGi=t.gi, cleared=0;
    marked.forEach((along,key)=>{
      const [rr,cc]=key.split(',').map(Number);
      const g=grid[rr][cc]; if(!g) return;
      lastGi=g.gi; cleared++;
      shatters.push({r:rr,c:cc,gi:g.gi,t:-(0.14+along*0.035)});
      grid[rr][cc]=null;
    });

    const cr=r+s.rows/2, cc0=c+s.cols/2;
    waves.push({x:bx+cc0*cell,y:by+cr*cell,t:0});
    glowT=1; glowH=GEMS[lastGi].h;
    shake=Math.min(11,3.5+total*1.8)*CFG.SHAKE;
    if(s.star) shake=Math.max(shake,12*CFG.SHAKE);
    if(combo>1) Sfx.combo(combo,total); else Sfx.clear(total);
    pops.push({x:bx+cc0*cell,y:by+cr*cell,t:0,txt:'+'+(gained-s.n),
               sub:combo>1?'COMBO ×'+combo:(total>1?total+' LINES':''),combo});

    // clean sweep — board completely emptied
    let anyLeft=false;
    for(let rr=0;rr<N&&!anyLeft;rr++) for(let cc=0;cc<N;cc++) if(grid[rr][cc]){anyLeft=true;break;}
    if(!anyLeft){
      const bonus=CFG.SWEEP_BONUS+cleared*CFG.SWEEP_PER_GEM;
      gained+=bonus;
      swept=true; trayHadSweep=true;
      pushBanner('CLEAN SWEEP','+'+bonus);
      for(let k=0;k<4;k++) waves.push({x:W/2,y:by+B/2,t:-k*0.18});
      shake=16*CFG.SHAKE; glowT=1.6;
      Sfx.sweep();
      tension=0;
    }
    tension=Math.max(0,tension-CFG.TENSION_DOWN);
  } else {
    combo=0;
    tension=Math.min(1,tension+CFG.TENSION_UP);
  }

  tension=Math.min(1,tension+(1-mobility())*CFG.TENSION_DRIFT);

  if(golden){
    golden.got.lines+=total; if(swept) golden.got.sweep=true;
    golden.pts+=gained;
    if(tray.every(v=>!v)){
      const hit=golden.want.sweep?golden.got.sweep:golden.got.lines>=golden.want.lines;
      if(hit){                                         // found it: multiply the whole hand's points
        const extra=Math.round(golden.pts*(CFG.GOLDEN_MULT-1));
        gained+=extra;
        pushBanner('GOLDEN ×'+CFG.GOLDEN_MULT,'+'+extra);
        for(let k=0;k<5;k++) waves.push({x:W/2,y:by+B/2,t:-k*0.14});
        for(let k=0;!reduce&&k<16;k++) sparkles.push({x:bx+Math.random()*B,y:by+Math.random()*B,t:Math.random()*0.5});
        shake=14*CFG.SHAKE; glowT=2; glowH=GEMS[GOLD].h;
        Sfx.goldenWin();
      }
      golden=null;                                     // missed: no penalty, hand just ends
    }
  }
  updateDbg();

  score+=gained; el('scoreVal').textContent=score;
  if(tray.every(v=>!v)){
    goldenNext = CFG.GOLDEN_ON && goldenCool<=0 && (trayHadSweep || trayCombo>=3 || (tension>0.5 && Math.random()<CFG.GOLDEN_CHANCE));
    trayHadSweep=false; trayCombo=0;
    genTray();
  }
  if(!tray.some(v=>v&&fitsAnywhere(v.s,grid))) setTimeout(gameOver,700);
}

/* ═══════ input ═══════ */
function slotRect(i){ const w=B/3; return {x:bx+w*i,y:trayY,w,h:trayH}; }
function onDown(e){
  if(state!=='play'||paused) return;
  ac();
  for(let i=0;i<3;i++){
    const R=slotRect(i);
    if(tray[i]&&e.clientX>=R.x&&e.clientX<=R.x+R.w&&e.clientY>=R.y-12&&e.clientY<=R.y+R.h+12){
      drag={i,x:e.clientX,y:e.clientY,px:e.clientX,vx:0,g:0};
      Sfx.pickup(); return;
    }
  }
}
function onMove(e){
  if(!drag||paused) return;
  drag.vx=drag.vx*0.7+(e.clientX-drag.px)*0.3; drag.px=e.clientX;
  drag.x=e.clientX; drag.y=e.clientY;
}
function onUp(){
  if(!drag||paused) return;
  const t=tray[drag.i];
  if(t){
    let g=ghost();
    if(!g && drag.last && performance.now()-drag.lastT<=CFG.SNAP_GRACE && canPlace(t.s,drag.last.r,drag.last.c,grid)) g=drag.last;
    if(g) place(drag.i,g.r,g.c);
    else{
      const s=t.s, R=slotRect(drag.i);
      ret={i:drag.i,t:0,fx:drag.x-(s.cols*cell)/2,fy:drag.y-cell*CFG.LIFT-(s.rows*cell)/2,fs:cell,
           tx:R.x+(R.w-s.cols*trayCell)/2,ty:R.y+(R.h-s.rows*trayCell)/2,ts:trayCell};
      Sfx.deny();
    }
  }
  drag=null;
}
function ghost(){
  if(!drag) return null;
  const t=tray[drag.i]; if(!t) return null;
  const s=t.s;
  // piece position in fractional grid cells
  const fc=(drag.x-(s.cols*cell)/2-bx)/cell;
  const fr=(drag.y-cell*CFG.LIFT-(s.rows*cell)/2-by)/cell;
  const dist=(r,c)=>Math.hypot(r-fr,c-fc);
  let g=null;
  // hysteresis: keep the current ghost until the piece moves well away from it
  const cur=drag.gh;
  if(cur && cur.s===s && dist(cur.r,cur.c)<=CFG.SNAP_STICKY && canPlace(s,cur.r,cur.c,grid)) g=cur;
  if(!g){
    // otherwise the closest valid spot within SNAP_RADIUS of the nearest grid position
    const r0=Math.round(fr), c0=Math.round(fc), R=CFG.SNAP_RADIUS;
    let best=Infinity;
    for(let dr=-R;dr<=R;dr++) for(let dc=-R;dc<=R;dc++){
      const r=r0+dr, c=c0+dc, d=dist(r,c);
      if(d<best && canPlace(s,r,c,grid)){ best=d; g={r,c,s}; }
    }
  }
  drag.gh=g;
  if(g){ drag.last=g; drag.lastT=performance.now(); }
  return g;
}
addEventListener('pointerdown',onDown,{passive:true});
addEventListener('pointermove',onMove,{passive:true});
addEventListener('pointerup',onUp,{passive:true});
addEventListener('pointercancel',()=>{drag=null;},{passive:true});

/* ═══════ draw ═══════ */
function gem(gi,x,y,sz,sx,alpha,flash,small,syArg){
  const scx=sx||1, scy=syArg===undefined?scx:syArg;
  const w=sz*scx, h=sz*scy;
  const a=alpha===undefined?1:alpha;
  if(a<=0||w<=0||h<=0) return;
  ctx.globalAlpha=a;
  ctx.drawImage((small?gemSmall:gemBig)[gi],x+(sz-w)/2,y+(sz-h)/2,w,h);
  if(flash>0.01){
    ctx.globalAlpha=a*flash; ctx.fillStyle='#fff';
    roundPath(ctx,x+(sz-w)/2+w*.06,y+(sz-h)/2+h*.06,w*.88,h*.88,w*.25); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function star(x,y,r,a){
  ctx.globalAlpha=a; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(x,y-r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
  ctx.fill(); ctx.globalAlpha=1;
}

// golden pieces: a soft pulsing halo behind, and a light band sweeping across the cells
function goldGlow(cx,cy,r,now,ph,rgb='255,206,72'){
  const pulse=reduce?0.6:0.5+0.5*Math.sin(now*0.005+ph);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${rgb},${0.3+0.32*pulse})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
}
function goldShimmer(now,s,dr,dc){
  if(reduce) return 0;
  const pos=((now*0.0009)%1)*(s.rows+s.cols+3)-1.5;
  return Math.max(0,1-Math.abs(dr+dc-pos)/1.2)*0.6;
}

let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=paused?0:Math.min(2.5,(now-last)/16.67)||1; last=now;
  shake*=Math.pow(.85,dt); glowT*=Math.pow(.93,dt);

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1B0E30'); bg.addColorStop(1,'#0E0719');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const amb=ctx.createRadialGradient(W/2,by+B/2,0,W/2,by+B/2,B*0.95);
  amb.addColorStop(0,`hsla(${glowH} 90% 60% / ${0.10+glowT*0.34})`);
  amb.addColorStop(1,'hsla(280 90% 60% / 0)');
  ctx.fillStyle=amb; ctx.fillRect(0,0,W,H);

  ctx.save();
  if(shake>.2) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  ctx.fillStyle='rgba(0,0,0,.34)'; roundPath(ctx,bx-9,by-9,B+18,B+18,20); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1.5; ctx.stroke();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const p=cell*.055; ctx.fillStyle='rgba(255,255,255,.045)';
    roundPath(ctx,bx+c*cell+p,by+r*cell+p,cell-p*2,cell-p*2,cell*.24); ctx.fill();
  }

  const gh=ghost();
  if(gh){
    let L;
    if(gh.s.star) L={rows:[gh.r],cols:[gh.c]};                 // preview the whole cross
    else{
      const test=grid.map(row=>row.slice());
      for(const [dr,dc] of gh.s.cells) test[gh.r+dr][gh.c+dc]=1;
      L=linesFor(test);
    }
    const sh=(Math.sin(now*0.006)*0.5+0.5)*0.18+0.14;
    ctx.globalAlpha=sh; ctx.fillStyle='#fff';
    L.rows.forEach(r=>ctx.fillRect(bx,by+r*cell,B,cell));
    L.cols.forEach(c=>ctx.fillRect(bx+c*cell,by,cell,B));
    ctx.globalAlpha=1;
    for(const [dr,dc] of gh.s.cells)
      gem(tray[drag.i].gi,bx+(gh.c+dc)*cell,by+(gh.r+dr)*cell,cell,.92,.4,0);
  }

  const claySquash=CFG.STYLE==='clay';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const g=grid[r][c]; if(!g) continue;
    if(g.t<1) g.t=Math.min(1,g.t+dt*0.085);
    if(g.t<=0) continue;
    const base=0.5+0.5*easeOutBack(g.t);
    if(claySquash&&g.t<1){
      const q=Math.sin(g.t*Math.PI)*0.17;
      gem(g.gi,bx+c*cell,by+r*cell,cell,base*(1+q),1,0,false,base*(1-q));
    } else gem(g.gi,bx+c*cell,by+r*cell,cell,base,1,0);
  }

  if(!reduce && now-lastSpark>CFG.SPARKLE_RATE && state==='play' && !paused && CFG.STYLE==='jewel'){
    lastSpark=now;
    const f=[];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]&&grid[r][c].t>=1) f.push([r,c]);
    if(f.length){
      const [r,c]=f[(Math.random()*f.length)|0];
      sparkles.push({x:bx+(c+.2+Math.random()*.6)*cell,y:by+(r+.2+Math.random()*.6)*cell,t:0});
    }
  }
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i]; s.t+=dt*0.045;
    if(s.t>=1){ sparkles.splice(i,1); continue; }
    const k=Math.sin(s.t*Math.PI); star(s.x,s.y,cell*0.26*k,k*0.9);
  }

  for(let i=sweeps.length-1;i>=0;i--){
    const s=sweeps[i]; s.t+=dt*0.07;
    if(s.t>=1){ sweeps.splice(i,1); continue; }
    const p=easeOutCubic(s.t), a=(1-s.t)*0.85;
    if(s.horiz){
      const x=bx+p*B, g=ctx.createLinearGradient(x-cell*1.6,0,x+cell*0.4,0);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${a})`);
      ctx.fillStyle=g; ctx.fillRect(bx,by+s.idx*cell,p*B,cell);
    } else {
      const y=by+p*B, g=ctx.createLinearGradient(0,y-cell*1.6,0,y+cell*0.4);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${a})`);
      ctx.fillStyle=g; ctx.fillRect(bx+s.idx*cell,by,cell,p*B);
    }
  }

  for(let i=blasts.length-1;i>=0;i--){                 // star blast: prismatic beams out along the row and column
    const b=blasts[i]; b.t+=dt*0.045;
    if(b.t>=1){ blasts.splice(i,1); continue; }
    const p=easeOutCubic(b.t), a=(1-b.t)*0.95, reach=p*B*1.25;
    const cx=bx+(b.c+.5)*cell, cy=by+(b.r+.5)*cell, hue=(b.t*300+200)%360;
    const th=cell*(1.1-0.6*b.t);
    const beam=(x0,y0,x1,y1,horiz)=>{
      const g=horiz?ctx.createLinearGradient(x0,0,x1,0):ctx.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=`hsla(${hue} 100% 70% / ${a*0.5})`;                // colored halo under a white core
      if(horiz) ctx.fillRect(x0,y0-th*0.9,x1-x0,th*1.8); else ctx.fillRect(x0-th*0.9,y0,th*1.8,y1-y0);
      ctx.fillStyle=g;
      if(horiz) ctx.fillRect(x0,y0-th/2,x1-x0,th); else ctx.fillRect(x0-th/2,y0,th,y1-y0);
    };
    beam(Math.max(bx,cx-reach),cy,Math.min(bx+B,cx+reach),cy,true);
    beam(cx,Math.max(by,cy-reach),cx,Math.min(by+B,cy+reach),false);
    const fr=cell*(0.6+1.6*p), fg=ctx.createRadialGradient(cx,cy,0,cx,cy,fr);
    fg.addColorStop(0,`rgba(255,255,255,${a})`); fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fg; ctx.fillRect(cx-fr,cy-fr,fr*2,fr*2);
    ctx.globalAlpha=1;
  }

  for(let i=shatters.length-1;i>=0;i--){
    const s=shatters[i]; s.t+=dt*0.055;
    if(s.t<0){ gem(s.gi,bx+s.c*cell,by+s.r*cell,cell,1,1,0); continue; }
    if(s.t>=1){
      const g=GEMS[s.gi], cx=bx+(s.c+.5)*cell, cy=by+(s.r+.5)*cell;
      for(let k=0;k<(reduce?3:CFG.SHARDS);k++){
        const a=Math.random()*6.283,sp=1.6+Math.random()*5;
        shards.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.4,
          r:cell*(.09+Math.random()*.16),rot:Math.random()*6.283,
          vr:(Math.random()-.5)*.34,life:1,
          col:`hsl(${g.h} ${g.s}% ${46+Math.random()*30}%)`});
      }
      shatters.splice(i,1); continue;
    }
    const e=Math.sin(s.t*Math.PI*0.5);
    gem(s.gi,bx+s.c*cell,by+s.r*cell,cell,1+0.34*e,1-s.t*s.t,e);
  }

  for(let i=shards.length-1;i>=0;i--){
    const b=shards[i];
    b.vy+=.4*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt; b.life-=.021*dt;
    if(b.life<=0){ shards.splice(i,1); continue; }
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
    ctx.globalAlpha=Math.max(0,b.life); ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.moveTo(0,-b.r); ctx.lineTo(b.r*.86,b.r*.5);
    ctx.lineTo(-b.r*.86,b.r*.5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha=1;

  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.t+=dt*0.05;
    if(w.t<0) continue;
    if(w.t>=1){ waves.splice(i,1); continue; }
    ctx.globalAlpha=(1-w.t)*0.5; ctx.strokeStyle='#fff';
    ctx.lineWidth=Math.max(1,cell*0.14*(1-w.t));
    ctx.beginPath(); ctx.arc(w.x,w.y,easeOutCubic(w.t)*B*0.62,0,6.283); ctx.stroke();
    ctx.globalAlpha=1;
  }

  for(let i=0;i<3;i++){
    const t=tray[i]; if(!t) continue;
    if(drag&&drag.i===i) continue;
    if(ret&&ret.i===i) continue;
    const R=slotRect(i),s=t.s;
    const bob=reduce?0:Math.sin(now*0.0022+i*2.1)*cell*0.045;
    const ox=R.x+(R.w-s.cols*trayCell)/2, oy=R.y+(R.h-s.rows*trayCell)/2+bob;
    const gold=t.gi===GOLD;
    if(gold) goldGlow(ox+s.cols*trayCell/2,oy+s.rows*trayCell/2,Math.max(s.cols,s.rows)*trayCell*0.95+trayCell*0.6,now,i);
    if(s.star) goldGlow(ox+trayCell/2,oy+trayCell/2,trayCell*1.5,now,i,'235,225,255');
    const pulse=s.star&&!reduce?1+0.08*Math.sin(now*0.004+i*2):1;         // star breathes gently
    for(const [dr,dc] of s.cells) gem(t.gi,ox+dc*trayCell,oy+dr*trayCell,trayCell,pulse,1,gold?goldShimmer(now,s,dr,dc):0,true);
  }

  if(ret){
    ret.t=Math.min(1,ret.t+dt*0.1);
    const e=easeOutBack(ret.t), t=tray[ret.i];
    if(t){
      const x=ret.fx+(ret.tx-ret.fx)*e, y=ret.fy+(ret.ty-ret.fy)*e, sz=ret.fs+(ret.ts-ret.fs)*e;
      for(const [dr,dc] of t.s.cells) gem(t.gi,x+dc*sz,y+dr*sz,sz,1,1,0,sz<cell*0.8);
    }
    if(ret.t>=1) ret=null;
  }

  if(drag&&tray[drag.i]){
    const t=tray[drag.i],s=t.s;
    drag.g=Math.min(1,drag.g+dt*0.14);
    const sc=1+0.09*easeOutBack(drag.g);
    const gold=t.gi===GOLD;
    ctx.save();
    ctx.translate(drag.x,drag.y-cell*CFG.LIFT);
    ctx.rotate(clamp(drag.vx*0.011,-.2,.2)); ctx.scale(sc,sc);
    if(gold) goldGlow(0,0,Math.max(s.cols,s.rows)*cell*0.95+cell*0.6,now,0);
    else if(s.star) goldGlow(0,0,cell*1.5,now,0,'235,225,255');
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=18; ctx.shadowOffsetY=8;
    const ox=-(s.cols*cell)/2, oy=-(s.rows*cell)/2;
    for(const [dr,dc] of s.cells) gem(t.gi,ox+dc*cell,oy+dr*cell,cell,1,1,gold?goldShimmer(now,s,dr,dc):0);
    ctx.restore();
  }

  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt*0.017;
    if(p.t>=1){ pops.splice(i,1); continue; }
    const sc=0.5+0.5*easeOutBack(Math.min(1,p.t*3.2));
    const rise=easeOutCubic(p.t)*cell*1.5, a=1-Math.pow(p.t,2.6);
    ctx.save(); ctx.translate(p.x,p.y-rise); ctx.scale(sc,sc);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=10;
    ctx.fillStyle=p.combo>3?'#FF7BD5':p.combo>1?'#FFD45C':'#FFFFFF';
    ctx.font='700 '+Math.round(cell*0.66)+'px "Fredoka",Verdana,sans-serif';
    ctx.fillText(p.txt,0,0);
    if(p.sub){
      ctx.fillStyle='#fff'; ctx.font='600 '+Math.round(cell*0.3)+'px "Fredoka",Verdana,sans-serif';
      ctx.fillText(p.sub,0,cell*0.42);
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  for(let i=banners.length-1;i>=0;i--){
    const b=banners[i]; b.t+=dt*0.009;
    if(b.t>=1){ banners.splice(i,1); continue; }
    if(b.t<0) continue;
    const sc=0.6+0.4*easeOutBack(Math.min(1,b.t*2.4));
    const a=b.t>0.72?(1-b.t)/0.28:1;
    ctx.save(); ctx.translate(W/2,by+B/2); ctx.scale(sc,sc);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.shadowColor='rgba(255,212,92,.8)'; ctx.shadowBlur=26;
    ctx.fillStyle='#FFD45C';
    ctx.font='700 '+Math.round(Math.min(W*0.13,62))+'px "Fredoka",Verdana,sans-serif';
    ctx.fillText(b.txt,0,0);
    ctx.shadowBlur=8; ctx.fillStyle='#fff';
    ctx.font='700 '+Math.round(Math.min(W*0.07,34))+'px "Fredoka",Verdana,sans-serif';
    ctx.fillText(b.sub,0,Math.min(W*0.1,48));
    ctx.restore(); ctx.globalAlpha=1;
  }

  ctx.restore();
}

/* ═══════ flow ═══════ */
async function gameOver(){
  if(state!=='play') return;
  if(paused){ setTimeout(gameOver,300); return; }
  state='over';
  const prevBest=best;
  best=Math.max(best,score); el('bestVal').textContent=best;
  deaths++;
  if(deaths%CFG.ADS_EVERY===0) await Ads.showInterstitial();
  el('overScore').textContent=score;
  el('overMsg').textContent=score>=1500?'That is a serious run.'
    :score>=600?'Good chains. Save the big shapes for open space.'
    :'Clear rows early — do not let the board fill up.';
  const btn=el('reviveBtn');
  const canRescue=rescuesUsed<CFG.MAX_RESCUES
    && (score>=CFG.RESCUE_FLOOR || score>=prevBest*CFG.RESCUE_BEST_FRAC) && score>0;
  btn.hidden=!canRescue;
  btn.textContent=rescues>0?'Use a rescue':'Watch an ad for a rescue';
  el('overCard').hidden=false;
}
async function rescue(){
  if(rescuesUsed>=CFG.MAX_RESCUES) return;
  if(rescues<=0){
    if(!await Ads.showRewarded()) return;
    rescues++;
  }
  rescues--; rescuesUsed++;
  waves.push({x:W/2,y:by+B/2,t:0}); glowT=1;
  Sfx.rescue();
  combo=0; tension=0.5; goldenNext=false; genRescue();
  el('overCard').hidden=true; state='play';
}
function start(){
  layout();
  grid=empty(); score=0; combo=0; rescues=CFG.FREE_RESCUES; rescuesUsed=0; tension=0; sweepCool=0; trayNo=0; carry=[];
  golden=null; goldenNext=false; goldenCool=0; trayHadSweep=false; trayCombo=0; starForced=false;
  shatters=[];shards=[];pops=[];sweeps=[];waves=[];sparkles=[];banners=[];blasts=[];drag=null;ret=null;
  el('scoreVal').textContent='0'; el('bestVal').textContent=best;
  genTray(); el('startCard').hidden=true; el('overCard').hidden=true; state='play';
}
function setStyle(s){
  CFG.STYLE=s;
  el('styJewel').setAttribute('aria-pressed',String(s==='jewel'));
  el('styClay').setAttribute('aria-pressed',String(s==='clay'));
  buildCache();
}
el('styJewel').onclick=e=>{e.stopPropagation();setStyle('jewel');};
el('styClay').onclick=e=>{e.stopPropagation();setStyle('clay');};
el('startBtn').onclick=e=>{e.stopPropagation();ac();start();};
el('againBtn').onclick=e=>{e.stopPropagation();start();};
el('reviveBtn').onclick=e=>{e.stopPropagation();rescue();};

/* ═══════ developer panel ═══════
   Everything is driven by the two tables below — a new toggle or slider is one line. */
const DEV_TOGGLES=[            // [CFG key, label]
  ['GOLDEN_ON','Golden Hand'],
  ['STAR_ENABLED','Star Gem'],
  ['SHOW_TENSION','Debug readout']
];
const DEV_SLIDERS=[            // [CFG key, label, min, max, step]
  ['TENSION_UP','Tension up (no clear)',0,0.5,0.01],
  ['TENSION_DOWN','Tension down (clear)',0,0.5,0.01],
  ['TENSION_DRIFT','Tension drift (cramped)',0,0.3,0.01],
  ['TIER_SOLVABLE','Tier: solvable above',0,1,0.01],
  ['TIER_JACKPOT','Tier: jackpot above',0,1,0.01],
  ['TIER_SWEEP','Tier: sweep above',0,1,0.01],
  ['SMALL_BIAS','Small-piece bias',0,8,0.1],
  ['SINGLE_WEIGHT','Single-cell weight',0,1,0.05],
  ['TIDY','Tidiness',0,5,0.1],
  ['PAIR_CHANCE','Partner-piece chance',0,1,0.05],
  ['STAR_CHANCE','Star gem chance (per tray)',0,0.5,0.01],
  ['STAR_COMBO','Star gem guaranteed at combo',2,10,1],
  ['SWEEP_COOLDOWN','Sweep cooldown (trays)',0,10,1],
  ['SNAP_RADIUS','Snap radius (cells)',0,3,1],
  ['SNAP_STICKY','Snap stickiness',0,1.5,0.05],
  ['LIFT','Piece lift (cells)',0,3,0.05]
];
const DEV_KEYS=[...DEV_TOGGLES.map(t=>t[0]),...DEV_SLIDERS.map(s=>s[0])];
const DEV_DEFAULTS=Object.fromEntries(DEV_KEYS.map(k=>[k,CFG[k]]));   // the values written in the file
const DEV_STORE='crumble.dev';
function devSave(){
  try{ localStorage.setItem(DEV_STORE,JSON.stringify(Object.fromEntries(DEV_KEYS.map(k=>[k,CFG[k]])))); }catch(e){}
}
function devLoad(){
  try{
    const o=JSON.parse(localStorage.getItem(DEV_STORE)||'{}');
    for(const k of DEV_KEYS) if(typeof o[k]===typeof DEV_DEFAULTS[k]) CFG[k]=o[k];
  }catch(e){}
}
function devSnippet(){
  const f=v=>typeof v==='number'?+v.toFixed(4):v;
  return '// dev panel snapshot — paste over the matching CFG entries\n'+DEV_KEYS.map(k=>`  ${k}: ${f(CFG[k])},`).join('\n');
}
function initDev(){
  el('devBtn').hidden=!CFG.DEV_MODE;
  if(!CFG.DEV_MODE) return;
  devLoad();
  const list=el('devList'), refresh=[];
  const make=(tag,cls)=>{ const n=document.createElement(tag); if(cls) n.className=cls; return n; };
  for(const [k,label] of DEV_TOGGLES){
    const row=make('label','tog'), name=make('span'), inp=make('input');
    name.textContent=label; inp.type='checkbox';
    inp.onchange=()=>{ CFG[k]=inp.checked; devSave(); updateDbg(); };
    refresh.push(()=>{ inp.checked=!!CFG[k]; });
    row.append(name,inp); list.append(row);
  }
  for(const [k,label,min,max,step] of DEV_SLIDERS){
    const box=make('div'), head=make('div','head'), name=make('span'), out=make('output'), inp=make('input');
    const dp=(String(step).split('.')[1]||'').length;
    name.textContent=label;
    Object.assign(inp,{type:'range',min,max,step});
    const show=()=>{ out.textContent=(+CFG[k]).toFixed(dp); };
    inp.oninput=()=>{ CFG[k]=+inp.value; show(); devSave(); };
    refresh.push(()=>{ inp.value=CFG[k]; show(); });
    head.append(name,out); box.append(head,inp); list.append(box);
  }
  const sync=()=>refresh.forEach(f=>f());
  el('devBtn').onclick=e=>{
    e.stopPropagation();
    paused=true; drag=null; shake=0;          // freeze the game while the panel is up
    sync(); el('devPanel').hidden=false;
  };
  el('devClose').onclick=e=>{ e.stopPropagation(); el('devPanel').hidden=true; paused=false; };
  el('devReset').onclick=e=>{
    e.stopPropagation();
    Object.assign(CFG,DEV_DEFAULTS);
    try{ localStorage.removeItem(DEV_STORE); }catch(_){}
    sync(); updateDbg();
  };
  el('devCopy').onclick=async e=>{
    e.stopPropagation();
    const txt=devSnippet(), btn=e.currentTarget;
    try{ await navigator.clipboard.writeText(txt); }
    catch(_){
      const ta=document.createElement('textarea'); ta.value=txt; document.body.append(ta); ta.select();
      try{ document.execCommand('copy'); }catch(__){}
      ta.remove();
    }
    btn.textContent='Copied!'; setTimeout(()=>{ btn.textContent='Copy settings'; },1200);
  };
}
initDev();

layout(); grid=empty(); genTray(); updateDbg(); requestAnimationFrame(frame);
})();
</script>
