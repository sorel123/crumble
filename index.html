<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crumble">
<meta name="theme-color" content="#150B26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Crumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#FFD45C; --ink:#2A1444; --font:"Fredoka","Trebuchet MS",Verdana,system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#150B26}
  body{font-family:var(--font);touch-action:none;user-select:none;color:#fff}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .hud{position:absolute;top:0;left:0;right:0;height:calc(92px + env(safe-area-inset-top,0px));
       padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
       display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .lbl{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .score{font-size:38px;font-weight:700;line-height:1;margin-top:1px;
         text-shadow:0 0 18px rgba(255,212,92,.35)}
  .right{text-align:right;display:flex;gap:14px;align-items:flex-start}
  .best{font-size:20px;font-weight:700;line-height:1;margin-top:3px;color:var(--gold)}
  #mute,#devBtn{pointer-events:auto;background:rgba(255,255,255,.09);border:0;color:#fff;
        width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer}
  #dbg{position:absolute;left:18px;top:calc(100px + env(safe-area-inset-top,0px));font-size:11px;font-weight:600;letter-spacing:.06em;
       opacity:.6;pointer-events:none}
  #dbg[hidden]{display:none}
  #devPanel{justify-content:flex-start;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
  #devList{flex:1 1 auto;min-height:0;width:min(420px,100%);overflow-y:auto;text-align:left;touch-action:pan-y;
           display:flex;flex-direction:column;gap:12px;padding:0 4px}
  #devList .tog,#devList .head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
  #devList .tog{padding:6px 0}
  #devList .head output{color:var(--gold);font-variant-numeric:tabular-nums}
  #devList input[type=range]{width:100%;touch-action:pan-y;accent-color:var(--gold)}
  #devList input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
  .devbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .devbtns button{font-size:14px;padding:10px 18px;min-height:44px}
  #devList .devhead{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
       opacity:.55;margin-top:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  #devList .devhead:first-child{border-top:0;margin-top:0;padding-top:0}
  .choices{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .choices button{font-family:var(--font);font-size:13px;font-weight:600;color:#fff;
       background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
       border-radius:999px;padding:7px 16px;min-height:38px;cursor:pointer}
  .choices button[aria-pressed="true"]{background:rgba(255,212,92,.16);border-color:var(--gold);color:var(--gold)}
  .choices .play{padding:7px 12px;font-size:15px}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
        padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:16px;padding:28px;text-align:center;
           background:radial-gradient(120% 90% at 50% 40%,rgba(45,20,74,.78),rgba(12,6,22,.96));
           backdrop-filter:blur(5px)}
  .overlay[hidden]{display:none}
  .title{font-size:clamp(46px,15vw,78px);font-weight:700;line-height:.92;letter-spacing:-.03em;
         text-shadow:0 0 40px rgba(255,212,92,.3)}
  .title em{font-style:normal;color:var(--gold)}
  .sub{font-size:15px;font-weight:500;opacity:.82;max-width:26ch;line-height:1.5}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
  .big{font-size:clamp(56px,19vw,92px);font-weight:700;line-height:1;color:var(--gold);
       text-shadow:0 0 34px rgba(255,212,92,.4)}
  button.cta{font-family:var(--font);font-size:18px;font-weight:600;color:var(--ink);
        background:linear-gradient(#FFE07A,#FFC12E);border:0;border-radius:999px;padding:15px 34px;
        min-height:56px;cursor:pointer;box-shadow:0 5px 0 #C9941A,0 8px 24px rgba(255,193,46,.3);
        transition:transform .08s,box-shadow .08s}
  button.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #C9941A}
  button.ghost{background:transparent;color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.3);
        font-size:15px;padding:12px 26px;min-height:48px;border-radius:999px;font-family:var(--font);
        font-weight:600;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(340px,100%)}
  .skin-btn{font-family:var(--font);font-size:12.5px;font-weight:600;color:#fff;
        background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
        border-radius:14px;padding:9px 4px;min-height:54px;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .skin-btn[aria-pressed="true"]{background:rgba(255,212,92,.16);border-color:var(--gold);color:var(--gold)}
  .skin-btn:disabled{opacity:.4;cursor:not-allowed}
  .skin-btn .lock{font-size:10px;font-weight:600;opacity:.85}
  .motifs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .motifs button{font-family:var(--font);font-size:12.5px;font-weight:600;color:#fff;
        background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);
        border-radius:999px;padding:8px 16px;min-height:38px;cursor:pointer}
  .motifs button[aria-pressed="true"]{background:rgba(255,212,92,.16);border-color:var(--gold);color:var(--gold)}

  .pips{display:flex;gap:5px;margin-top:6px;align-items:center}
  .pips .mult{font-size:12px;font-weight:700;color:var(--gold);margin-left:4px;line-height:1}
  .pips[hidden]{display:none}
  .pips .pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
  .pips .pip.on{background:#FFD45C;box-shadow:0 0 8px rgba(255,212,92,.9)}

  #startCard{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .section-lbl{align-self:flex-start;margin:-6px 0 -6px 2px}

  #adScreen{background:#0B0713;gap:20px}
  .adbox{width:min(320px,86vw);aspect-ratio:4/3;border-radius:18px;display:flex;
         align-items:center;justify-content:center;font-size:13px;letter-spacing:.28em;
         font-weight:600;opacity:.45;border:2px dashed rgba(255,255,255,.26)}
  #adTimer{font-size:13px;opacity:.6;font-weight:600}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <div><div class="lbl">Score</div><div class="score" id="scoreVal">0</div>
      <div class="pips" id="transformPips" hidden></div>
    </div>
    <div class="right">
      <div><div class="lbl">Best</div><div class="best" id="bestVal">0</div></div>
      <button id="devBtn" aria-label="Developer settings" hidden>⚙️</button>
      <button id="mute" aria-label="Toggle sound">🔊</button>
    </div>
  </div>
  <div id="dbg"></div>

  <div class="overlay" id="startCard">
    <h1 class="title">Crum<em>ble</em></h1>
    <p class="sub">Drag the three shapes onto the board. Fill a whole row or column and it clears. Empty the board for a clean sweep.</p>
    <p class="lbl section-lbl">World</p>
    <div class="skins" id="worldGrid"></div>
    <p class="lbl section-lbl">Skin</p>
    <div class="skins" id="skinGrid"></div>
    <p class="lbl section-lbl">Motif</p>
    <div class="motifs" id="motifRow"></div>
    <button class="cta" id="startBtn">Play</button>
  </div>

  <div class="overlay" id="overCard" hidden>
    <p class="eyebrow">No room left</p>
    <p class="big" id="overScore">0</p>
    <p class="sub" id="overMsg"></p>
    <button class="cta" id="reviveBtn">Watch an ad to keep going</button>
    <button class="ghost" id="againBtn">Start over</button>
  </div>

  <div class="overlay" id="adScreen" hidden>
    <p class="eyebrow">Advertisement</p>
    <div class="adbox">YOUR AD HERE</div>
    <p id="adTimer">5</p>
    <button class="cta" id="adClose" disabled>Close</button>
  </div>

  <div class="overlay" id="devPanel" hidden>
    <p class="eyebrow">Developer settings · game paused</p>
    <div id="devList"></div>
    <div class="devbtns">
      <button class="ghost" id="devReset">Reset to defaults</button>
      <button class="ghost" id="devCopy">Copy settings</button>
      <button class="cta" id="devClose">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
/* ═══════════════════════════════════════════════════════════════
   TUNE THESE
   ═══════════════════════════════════════════════════════════════ */
const CFG = {
  GRID: 8,
  DEV_MODE: true,        // shows the gear + developer panel; set false before release (also ignores saved panel overrides)
  SNAP_RADIUS:   1,      // cells searched around the nearest grid spot (per axis) when it isn't valid
  SNAP_STICKY:   0.6,    // a shown ghost is kept until the piece drifts this many cells from it
  SNAP_GRACE:    150,    // ms after a ghost vanishes that releasing still places it
  STYLE: 'jewel',        // a SKINS id — picked on the skins screen; some are unlockable
  MOTIF: 'none',         // a MOTIFS id — face motif stamped on every tile, independent of skin
  UNLOCK_ALL: false,     // dev: pretend every skin is unlocked
  HOME_WORLD: 'night',   // a HOME_WORLDS id, or a discovered TRANSFORMS id — her default background
  UNLOCK_ALL_WORLDS: false, // dev: every world selectable regardless of discovery

  // difficulty wave
  TENSION_UP:    0.18,   // added each placement that clears nothing
  TENSION_DRIFT: 0.07,   // extra rise when the board is getting cramped
  TENSION_DOWN:  0.18,   // subtracted when you clear (softer = help lingers longer)
  CANDIDATES:    36,   // random hands tried per tray before settling
  NODE_BUDGET:   2600,   // search cap per hand (raise = smarter, slower)
  SWEEP_COOLDOWN: 3,    // trays that must pass before another sweep hand
  SINGLE_WEIGHT: 0.35,   // multiplier on the 1-cell piece (density bias otherwise floods the tray with them)
  EARLY_TRAYS:   4,      // opening trays that favor stackable pieces (bars and rectangles)
  EARLY_AWKWARD: 0.15,   // weight multiplier for non-rectangles during those trays
  PAIR_CHANCE:   0.7,    // odds a tray carries a partner for an awkward piece (L/J/T/S/Z) from the previous tray
  TIDY:          2.0,    // how much hand choice favors a compact board (0 = ignore; higher = flatter, fewer holes)
  SWEEP_MIN: 6, SWEEP_MAX: 30,  // gem count range where a sweep is plausible

  // scoring
  LINE_POINTS: 10, COMBO_STEP: 0.5,
  SWEEP_BONUS: 300, SWEEP_PER_GEM: 25,

  // golden hand: a bonus tray that multiplies the points it earns
  GOLDEN_COMBO:    2,    // a combo this high (or higher) queues one for the next tray (so does a clean sweep)
  GOLDEN_CHANCE:   0.10, // random roll after every tray
  GOLDEN_COOLDOWN: 3,    // trays that must pass before another golden hand
  GOLDEN_MULT:     3,    // multiplier when she finds it: clears at least (planned lines - 1), min 1 (a planned sweep: 3+ lines)
  GOLDEN_PARTIAL:  2,    // consolation multiplier for any other clear during the hand; a miss costs nothing

  FREE_RESCUES: 1,       // rescues every run starts with (first one is never behind an ad)
  MAX_RESCUES: 2,        // most rescues one run can use
  RESCUE_FLOOR: 300,     // offer a rescue only above this score...
  RESCUE_BEST_FRAC: 0.5, // ...or above this fraction of her best
  ADS_EVERY: 3,
  SHARDS: 8, SHAKE: 1.0, SPARKLE_RATE: 620,
  // star gem: a single-cell piece that clears its whole row and column
  STAR_ENABLED:  true,   // master switch for star gems
  STAR_CHANCE:   0.08,   // odds each tray carries one, replacing a normal piece
  STAR_COMBO:    4,      // a combo this high (or higher) guarantees one in the next normal tray

  GOLDEN_ENABLED: true,  // master switch for golden hands

  LIFT:          1.55,   // how far above the finger a dragged piece floats, in cells
  SMALL_BIAS:    3.0,    // density bias in weightedShape: higher = fewer big pieces as the board fills
  TIER_SOLVABLE: 0.05,   // tension above this deals 'solvable' hands (2+ lines)
  TIER_JACKPOT:  0.25,   // ...above this 'jackpot' hands (3+ lines)
  TIER_SWEEP:    0.70,   // ...above this a planned clean sweep (when off cooldown)

  // transformations — achievement-triggered event looks (own world + own tile skin), temporary
  TRANSFORM_ENABLED:    true,  // master switch
  TRANSFORM_PLACEMENTS: 9,     // how many placements one lasts
  TRANSFORM_MULT:       1.5,   // score multiplier while active
  TRANSFORM_COOLDOWN:   5,     // trays that must pass after one ends before another can start
  MYSTERY_CHANCE:       0.015, // odds a fresh tray triggers a random one anyway (blocked by the cooldown too)

  // event screen effects — each independently toggleable; none may ever draw over live board gems
  FX_COMBO_GLOW:     true,   // screen-edge glow in the combo colour, intensifying with the streak
  FX_GOLD_TINT:      true,   // faint full-screen gold wash while a golden hand is live
  FX_SWEEP_FX:       true,   // full-screen colour wash + confetti on a clean sweep
  FX_TENSION_BORDER: true,   // board border glow: calm (cool) -> warm as tension rises
  FX_PUNCH_ZOOM:     true,   // brief 2-3% punch zoom on a 2+ line clear

  // sound — variant + volume for the two most-heard effects, set on the settings panel
  SND_PICKUP:     'plastic',  // 'plastic' | 'wood' | 'magnet'
  SND_PLACE:      'plastic',
  SND_PICKUP_VOL: 1,
  SND_PLACE_VOL:  1,

  SHOW_TENSION: true     // set false to hide the debug readout
};

const GEMS=[
  {h:344,s:88},{h: 32,s:96},{h:150,s:72},
  {h:188,s:85},{h:226,s:88},{h:278,s:82},
  {h: 47,s:100,gold:true},                // golden hands only — never dealt in a normal tray
  {h:255,s:30,star:true}                  // star gem only
];
const GOLD=6, STAR_GI=7, NCOLOR=6;        // NCOLOR = the ordinary colours dealt at random

/* ═══════ worlds — Home (picked) + Transformations (earned) ═══════
   A world is a background gradient + an ambient particle effect, drawn
   behind the board. HOME_WORLDS are always available; she picks one plus
   a tile skin on the start screen — that's the look for the whole run.
   TRANSFORMS are temporary: an achievement swaps both the world AND the
   tile skin for a few placements (see genGolden.. no — see place()/
   triggerTransform below), then flips back. The first time one triggers,
   its world is 'discovered' and joins the home picker; its tile skin
   stays event-only and is never independently selectable.            */
const HOME_WORLDS=[
  {id:'night',   name:'Night',          top:'#1B0E30', bottom:'#0E0719', effect:'none'},
  {id:'ocean',   name:'Ocean',          top:'#0A3A52', bottom:'#041F30', effect:'bubbles'},
  {id:'sunset',  name:'Sunset',         top:'#4A1E3D', bottom:'#22091C', effect:'embers'},
  {id:'aurora',  name:'Aurora',         top:'#0C2E28', bottom:'#081526', effect:'ribbons'},
  {id:'forest',  name:'Forest',         top:'#0E2A18', bottom:'#071409', effect:'fireflies'},
  {id:'arctic',  name:'Arctic',         top:'#1C3A4A', bottom:'#0B1E2A', effect:'snowfall'},
  {id:'blossom', name:'Cherry Blossom', top:'#3A1E2E', bottom:'#1C0E18', effect:'petals'},
  {id:'reef',    name:'Reef',           top:'#063440', bottom:'#021820', effect:'rays'},
  {id:'desert',  name:'Desert Night',   top:'#2A1B12', bottom:'#140D08', effect:'shootingstars'},
  {id:'neon',    name:'Neon City',      top:'#1A0B2E', bottom:'#05030C', effect:'grid'}
];
const TRANSFORMS={
  rainbow:  {name:'Rainbow',    world:{top:'#4A1050',bottom:'#200828',effect:'confetti'},          skin:'rainbow'},
  goldvault:{name:'Gold Vault', world:{top:'#3A2A10',bottom:'#1A1206',effect:'sparks'},             skin:'goldvault'},
  volcano:  {name:'Volcano',    world:{top:'#4A1408',bottom:'#1A0602',effect:'embers'},             skin:'volcano'},
  starfield:{name:'Starfield',  world:{top:'#0A0A1C',bottom:'#020208',effect:'stars'},              skin:'starfield'},
  storm:    {name:'Storm',      world:{top:'#232B38',bottom:'#0C1016',effect:'storm',flash:true},   skin:'storm'}
};
const TRANSFORM_IDS=Object.keys(TRANSFORMS);
function worldDef(id){    // resolves a HOME_WORLDS id or a TRANSFORMS id to {top,bottom,effect,flash?}
  const t=TRANSFORMS[id]; if(t) return t.world;
  return HOME_WORLDS.find(w=>w.id===id) || HOME_WORLDS[0];
}
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function lerpCol(a,b,t){
  const A=hex2rgb(a),B2=hex2rgb(b);
  return `rgb(${Math.round(A[0]+(B2[0]-A[0])*t)},${Math.round(A[1]+(B2[1]-A[1])*t)},${Math.round(A[2]+(B2[2]-A[2])*t)})`;
}

const AMBIENT_N={none:0,bubbles:22,embers:20,ribbons:5,stars:55,fireflies:16,snowfall:26,petals:16,
  rays:4,shootingstars:4,grid:14,confetti:24,sparks:18,storm:40};
function ambientParticle(effect,initial){
  switch(effect){
    case 'bubbles': return {x:Math.random()*W,y:initial?Math.random()*H:H+20,r:3+Math.random()*7,
      vy:-(0.12+Math.random()*0.28),ph:Math.random()*6.283,ps:0.01+Math.random()*0.02,a:0.12+Math.random()*0.22};
    case 'embers': return {x:Math.random()*W,y:initial?Math.random()*H:H+15,r:1.4+Math.random()*2.3,
      vy:-(0.1+Math.random()*0.2),vx:(Math.random()-.5)*0.2,ph:Math.random()*6.283,ps:0.015+Math.random()*0.02,
      a:0.25+Math.random()*0.35,hue:20+Math.random()*30};
    case 'ribbons': return {y:Math.random()*H*0.55+H*0.05,amp:26+Math.random()*38,speed:0.12+Math.random()*0.1,
      ph:Math.random()*6.283,hue:140+Math.random()*90,a:0.07+Math.random()*0.06,w:2+Math.random()*2};
    case 'stars': return {x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.5,
      ph:Math.random()*6.283,ps:0.02+Math.random()*0.05,a:0.35+Math.random()*0.5};
    case 'fireflies': return {x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.15,vy:(Math.random()-.5)*0.15,
      ph:Math.random()*6.283,ps:0.02+Math.random()*0.03,r:1.5+Math.random()*1.8,a:0.3+Math.random()*0.4};
    case 'snowfall': return {x:Math.random()*W,y:initial?Math.random()*H:-10,r:1.5+Math.random()*2.5,
      vy:0.3+Math.random()*0.5,ph:Math.random()*6.283,ps:0.01+Math.random()*0.02,a:0.3+Math.random()*0.4};
    case 'petals': return {x:Math.random()*W,y:initial?Math.random()*H:-10,vy:0.35+Math.random()*0.4,
      vx:(Math.random()-.3)*0.3,rot:Math.random()*6.283,vr:(Math.random()-.5)*0.03,
      w:4+Math.random()*3,h:2.5+Math.random()*2,a:0.4+Math.random()*0.35};
    case 'rays': return {x:Math.random()*W,ph:Math.random()*6.283,speed:0.15+Math.random()*0.1,
      w:W*0.12+Math.random()*W*0.08,a:0.05+Math.random()*0.05};
    case 'shootingstars': return {x:-50,y:Math.random()*H*0.4,vx:0,vy:0,life:0,wait:40+Math.random()*200};
    case 'grid': return {y:Math.random()*H,hue:280+Math.random()*40,a:0.1+Math.random()*0.08};
    case 'confetti': return {x:Math.random()*W,y:initial?Math.random()*H:-10,vy:0.5+Math.random()*0.6,
      vx:(Math.random()-.5)*0.3,rot:Math.random()*6.283,vr:(Math.random()-.5)*.08,
      w:4+Math.random()*3,h:6+Math.random()*4,hue:Math.random()*360,a:0.5+Math.random()*0.3};
    case 'sparks': return {x:Math.random()*W,y:initial?Math.random()*H:H+10,r:1+Math.random()*1.6,
      vy:-(0.15+Math.random()*0.2),ph:Math.random()*6.283,ps:0.02+Math.random()*0.02,a:0.3+Math.random()*0.3};
    case 'storm': return {x:Math.random()*W,y:initial?Math.random()*H:-10,vy:3+Math.random()*2,
      len:10+Math.random()*8,a:0.2+Math.random()*0.15};
    default: return {};
  }
}
function spawnAmbient(effect){
  const n=AMBIENT_N[effect]||0, out=[];
  for(let i=0;i<n;i++) out.push(ambientParticle(effect,true));
  return out;
}
// advances/draws one particle set; alphaMul crossfades it in or out, respawn=false lets a dying set drain away
function stepAmbient(list,effect,dt,boost,alphaMul,respawn){
  if(alphaMul<=0) return;
  for(let i=list.length-1;i>=0;i--){
    const p=list[i];
    if(effect==='bubbles'){
      p.y+=p.vy*dt*boost; p.ph+=p.ps*dt*boost;
      if(p.y<-20){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      const x=p.x+Math.sin(p.ph)*6;
      ctx.globalAlpha=p.a*alphaMul; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,p.y,p.r,0,6.283); ctx.stroke();
      ctx.globalAlpha=p.a*alphaMul*0.35; ctx.fillStyle='rgba(180,230,255,1)'; ctx.fill();
    } else if(effect==='embers'||effect==='sparks'){
      p.y+=p.vy*dt*boost; p.x+=(p.vx||0)*dt*boost+Math.sin(p.ph)*0.15; p.ph+=p.ps*dt*boost;
      if(p.y<-15){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      ctx.globalAlpha=p.a*alphaMul;
      ctx.fillStyle=effect==='sparks'?'hsl(46 95% 65%)':`hsl(${p.hue} 90% 62%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    } else if(effect==='ribbons'){
      p.ph+=p.speed*dt*boost*0.02;
      ctx.globalAlpha=alphaMul; ctx.strokeStyle=`hsla(${p.hue} 80% 65% / ${p.a})`; ctx.lineWidth=p.w;
      ctx.beginPath();
      for(let x=0;x<=W;x+=16){ const y=p.y+Math.sin(x*0.012+p.ph)*p.amp; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
    } else if(effect==='stars'){
      p.ph+=p.ps*dt*boost;
      const tw=0.6+0.4*Math.sin(p.ph);
      ctx.globalAlpha=p.a*tw*alphaMul; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(boost>1.3?1.6:1),0,6.283); ctx.fill();
    } else if(effect==='fireflies'){
      p.x+=p.vx*dt*boost; p.y+=p.vy*dt*boost; p.ph+=p.ps*dt*boost;
      if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
      const tw=0.4+0.6*Math.max(0,Math.sin(p.ph));
      ctx.globalAlpha=p.a*tw*alphaMul; ctx.fillStyle='hsl(70 90% 65%)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    } else if(effect==='snowfall'){
      p.y+=p.vy*dt*boost; p.ph+=p.ps*dt*boost;
      if(p.y>H+10){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      const x=p.x+Math.sin(p.ph)*10;
      ctx.globalAlpha=p.a*alphaMul; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(x,p.y,p.r,0,6.283); ctx.fill();
    } else if(effect==='petals'){
      p.y+=p.vy*dt*boost; p.x+=p.vx*dt*boost; p.rot+=p.vr*dt*boost;
      if(p.y>H+10){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=p.a*alphaMul; ctx.fillStyle='#FFB6D5';
      ctx.beginPath(); ctx.ellipse(0,0,p.w,p.h,0,0,6.283); ctx.fill(); ctx.restore();
    } else if(effect==='rays'){
      p.ph+=p.speed*dt*boost*0.01;
      const x=p.x+Math.sin(p.ph)*30;
      const g=ctx.createLinearGradient(x-p.w/2,0,x+p.w/2,0);
      g.addColorStop(0,'rgba(180,230,255,0)'); g.addColorStop(.5,`rgba(180,230,255,${p.a*alphaMul})`); g.addColorStop(1,'rgba(180,230,255,0)');
      ctx.fillStyle=g; ctx.fillRect(x-p.w/2,0,p.w,H);
    } else if(effect==='shootingstars'){
      if(p.life<=0){
        p.wait-=dt*boost;
        if(p.wait<=0){ p.x=Math.random()*W*0.3; p.y=Math.random()*H*0.25; p.vx=4+Math.random()*3; p.vy=2+Math.random()*1.5; p.life=1; }
      } else {
        p.x+=p.vx*dt*boost; p.y+=p.vy*dt*boost; p.life-=dt*0.025*boost;
        if(p.life<=0||p.x>W+50){ p.life=0; p.wait=40+Math.random()*200; p.x=-50; }
        else{
          ctx.globalAlpha=alphaMul*Math.min(1,p.life*2); ctx.strokeStyle='#fff'; ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*4,p.y-p.vy*4); ctx.stroke();
        }
      }
    } else if(effect==='grid'){
      p.y-=0.4*dt*boost; if(p.y<0) p.y=H;
      ctx.globalAlpha=p.a*alphaMul; ctx.strokeStyle=`hsl(${p.hue} 90% 65%)`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,p.y); ctx.lineTo(W,p.y); ctx.stroke();
    } else if(effect==='confetti'){
      p.y+=p.vy*dt*boost; p.x+=p.vx*dt*boost; p.rot+=p.vr*dt*boost;
      if(p.y>H+10){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=p.a*alphaMul; ctx.fillStyle=`hsl(${p.hue} 90% 65%)`;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    } else if(effect==='storm'){
      p.y+=p.vy*dt*boost;
      if(p.y>H+20){ if(respawn) Object.assign(p,ambientParticle(effect,false)); else{ list.splice(i,1); continue; } }
      ctx.globalAlpha=p.a*alphaMul; ctx.strokeStyle='rgba(200,220,255,.8)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+p.len); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

/* ── flip transition: a diagonal card-flip wave across the board, then the
   tray, swapping from one world+skin to another. All timings in frames
   (~60/s). Skipped (snapped instantly) under prefers-reduced-motion.    */
const FLIP_WAVE=28, FLIP_CELL=16, FLIP_GAP=6, FLIP_STAGGER=5, FLIP_TRAY=14;
const FLIP_BG_DUR=FLIP_WAVE+FLIP_CELL;
const FLIP_TOTAL=FLIP_WAVE+FLIP_CELL+FLIP_GAP+2*FLIP_STAGGER+FLIP_TRAY;
function resetWorld(){
  curWorld=CFG.HOME_WORLD; curSkin=CFG.STYLE;
  buildCache();                     // curSkin may have just changed (a fresh run can follow a skin pick)
  ambient=spawnAmbient(worldDef(curWorld).effect); ambientOld=[]; ambientBurst=0;
  bgFrom=curWorld; bgT=1; flip=null; transform=null; transformCool=0; lightningT=0;
  renderPips();
}
function startFlip(toWorld,toSkin){
  if(reduce){                                    // snap straight there, no animation
    curWorld=toWorld; curSkin=toSkin; buildCache();
    ambient=spawnAmbient(worldDef(curWorld).effect); ambientOld=[];
    bgFrom=curWorld; bgT=1; flip=null; return;
  }
  bgFrom=curWorld; bgT=0; ambientOld=ambient;
  const fromBig=gemBig, fromSmall=gemSmall;        // snapshot the outgoing tile textures
  curWorld=toWorld; curSkin=toSkin;
  buildCache();                                    // rebuild gemBig/gemSmall to the target now
  ambient=spawnAmbient(worldDef(curWorld).effect);
  flip={t:0,fromBig,fromSmall};
}
function stepFlip(dt){
  if(!flip) return;
  flip.t+=dt;
  if(bgT<1){ bgT=Math.min(1,flip.t/FLIP_BG_DUR); if(bgT>=1) ambientOld=[]; }
  if(flip.t>=FLIP_TOTAL) flip=null;
}

/* ═══════════════════════════════════════════════════════════════
   THE SOLVER
   The board is packed into a flat Uint8Array for speed. evalHand
   tries all six orderings of the three pieces and every legal
   position, APPLYING CLEARS BETWEEN PLACEMENTS — so a hand where
   piece 1 must clear a row before piece 2 has anywhere to go is
   found as a valid line. Capped by a node budget so it can never
   stall a frame.
   ═══════════════════════════════════════════════════════════════ */
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

function packGrid(g){
  const a=new Uint8Array(N*N);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) a[r*N+c]=g[r][c]?1:0;
  return a;
}
/* The search runs on a bitboard: 64 cells as two 32-bit ints (rows 0-3
   in lo, rows 4-7 in hi), so a fit test is two ANDs and a placement is
   two ORs — no allocation per node. Same DFS order and node budget as
   the array version it replaced, so it returns identical answers, just
   ~20x faster (a tray refill used to cost a visible frame on a phone). */
const pop32=x=>{ x-=(x>>>1)&0x55555555; x=(x&0x33333333)+((x>>>2)&0x33333333); return (((x+(x>>>4))&0x0F0F0F0F)*0x01010101)>>>24; };
function packBits(a){ let lo=0,hi=0; for(let i=0;i<32;i++){ if(a[i]) lo|=1<<i; if(a[i+32]) hi|=1<<i; } return [lo,hi]; }
function placeMasks(s){                      // every legal (r,c) for a shape, in the solver's scan order, cached on the shape
  if(s._pm) return s._pm;
  const out=[];
  for(let r=0;r<=N-s.rows;r++) for(let c=0;c<=N-s.cols;c++){
    let lo=0,hi=0;
    for(const [dr,dc] of s.cells){ const i=(r+dr)*N+c+dc; if(i<32) lo|=1<<i; else hi|=1<<(i-32); }
    out.push({r,c,lo,hi});
  }
  return (s._pm=out);
}
const COL=0x01010101;
function roughBits(lo,hi){                   // filled/empty edges: low = compact, high = ragged
  return pop32((lo^(lo>>>1))&0x7F7F7F7F)+pop32((hi^(hi>>>1))&0x7F7F7F7F)
       + pop32((lo^(lo>>>8))&0x00FFFFFF)+pop32((hi^(hi>>>8))&0x00FFFFFF)
       + pop32(((lo>>>24)^hi)&0xFF);
}
let _lo=0,_hi=0;                             // applyBits' result board (avoids allocating a pair per node)
function applyBits(lo,hi,s,m){               // returns lines cleared; new board left in _lo/_hi
  if(s.star){                                // star: wipes its row and column; each counts if it held a gem
    const r=m.r,c=m.c, rm=0xFF<<((r&3)*8), cm=COL<<c;
    const rowHas=(r<4?lo&rm:hi&rm)?1:0, colHas=((lo&cm)|(hi&cm))?1:0;
    if(r<4) lo&=~rm; else hi&=~rm;
    _lo=lo&~cm; _hi=hi&~cm; return rowHas+colHas;
  }
  lo|=m.lo; hi|=m.hi;
  let clo=0,chi=0,n=0;
  for(let r=0;r<4;r++){ const rm=0xFF<<(r*8); if((lo&rm)===rm){ clo|=rm; n++; } if((hi&rm)===rm){ chi|=rm; n++; } }
  for(let c=0;c<8;c++){ const cm=COL<<c; if((lo&cm)===cm&&(hi&cm)===cm){ clo|=cm; chi|=cm; n++; } }
  _lo=lo&~clo; _hi=hi&~chi; return n;
}
const countFlat=a=>{ let n=0; for(let i=0;i<a.length;i++) if(a[i]) n++; return n; };

function evalHand(a0,shapes,budget){
  const res={ok:false,lines:0,sweep:false,cleared:0,rough:999};
  const base=countFlat(a0)+shapes.reduce((n,s)=>n+(s.star?0:s.n),0);   // a star adds no gem to the board
  const [lo0,hi0]=packBits(a0);
  const pm=shapes.map(placeMasks);
  let b=budget;
  function dfs(lo,hi,order,i,acc){
    if(b<=0||res.sweep) return;
    if(i===3){
      res.ok=true; if(acc>res.lines) res.lines=acc;
      const cl=base-pop32(lo)-pop32(hi); if(cl>res.cleared) res.cleared=cl;
      const rg=roughBits(lo,hi); if(rg<res.rough) res.rough=rg;
      return;
    }
    const k=order[i], s=shapes[k];
    for(const m of pm[k]){
      if(b<=0||res.sweep) return;
      if((lo&m.lo)||(hi&m.hi)) continue;
      b--;
      const lines=applyBits(lo,hi,s,m), nlo=_lo, nhi=_hi;
      if(lines&&!nlo&&!nhi){
        res.sweep=true; res.ok=true; res.cleared=base; res.rough=0; res.lines=Math.max(res.lines,acc+lines); return;
      }
      dfs(nlo,nhi,order,i+1,acc+lines);
    }
  }
  for(const p of PERMS){ dfs(lo0,hi0,p,0,0); if(res.sweep) break; }
  return res;
}

/* ── clean-sweep planner ───────────────────────────────────────
   Random hands almost never produce a sweep, so build one
   backwards: pick a set of rows/columns that covers every gem on
   the board, take their empty cells as a target, and try to tile
   that target exactly with up to three shapes. Then verify with
   the real solver before serving it.                            */
function coverAll(a,useRows,useCols){
  const occ=[]; for(let i=0;i<a.length;i++) if(a[i]) occ.push(i);
  const rows=new Set(), cols=new Set(), left=new Set(occ);
  while(left.size){
    let bestK=null,bestN=-1,bestIsRow=true;
    if(useRows) for(let r=0;r<N;r++){
      if(rows.has(r)) continue;
      let n=0; for(const i of left) if(((i/N)|0)===r) n++;
      if(n>bestN){bestN=n;bestK=r;bestIsRow=true;}
    }
    if(useCols) for(let c=0;c<N;c++){
      if(cols.has(c)) continue;
      let n=0; for(const i of left) if(i%N===c) n++;
      if(n>bestN){bestN=n;bestK=c;bestIsRow=false;}
    }
    if(bestK===null||bestN<=0) return null;
    if(bestIsRow){ rows.add(bestK); for(const i of [...left]) if(((i/N)|0)===bestK) left.delete(i); }
    else { cols.add(bestK); for(const i of [...left]) if(i%N===bestK) left.delete(i); }
  }
  return {rows:[...rows],cols:[...cols]};
}
function targetCells(a,cov){
  const T=new Set();
  cov.rows.forEach(r=>{ for(let c=0;c<N;c++) if(!a[r*N+c]) T.add(r*N+c); });
  cov.cols.forEach(c=>{ for(let r=0;r<N;r++) if(!a[r*N+c]) T.add(r*N+c); });
  return [...T];
}
function tileExact(T){
  const pool=SHAPES.slice().sort(()=>Math.random()-0.5);
  const out=[];
  function rec(rem){
    if(rem.size===0) return true;
    if(out.length>=3) return false;
    let first=Infinity; for(const v of rem) if(v<first) first=v;
    const fr=(first/N)|0, fc=first%N;
    for(const s of pool){
      for(const [dr,dc] of s.cells){
        const r=fr-dr, c=fc-dc;
        if(r<0||c<0||r+s.rows>N||c+s.cols>N) continue;
        const idx=[]; let ok=true;
        for(const [ar,ac] of s.cells){
          const id=(r+ar)*N+(c+ac);
          if(!rem.has(id)){ ok=false; break; }
          idx.push(id);
        }
        if(!ok) continue;
        idx.forEach(i=>rem.delete(i)); out.push(s);
        if(rec(rem)) return true;
        out.pop(); idx.forEach(i=>rem.add(i));
      }
    }
    return false;
  }
  return rec(new Set(T)) ? out.slice() : null;
}
function planSweep(a){
  const n=countFlat(a);
  if(n<CFG.SWEEP_MIN||n>CFG.SWEEP_MAX) return null;
  for(const [ur,uc] of [[true,true],[true,false],[false,true]]){
    const cov=coverAll(a,ur,uc); if(!cov) continue;
    const T=targetCells(a,cov);
    if(!T.length||T.length>15) continue;
    const tiles=tileExact(T); if(!tiles) continue;
    const hand=tiles.slice(0,3);
    while(hand.length<3) hand.push(SHAPES[(Math.random()*4)|0]);
    if(evalHand(a,hand,6000).sweep) return hand;
  }
  return null;
}

/* ── hand selection ─────────────────────────────────────────── */
const stackable=s=>s.n===s.rows*s.cols && s.n<=6;   // bars and small rectangles
/* partners: for each piece, the shapes that sit against it to form a
   solid 2-4 wide block (at most one hole, which a single fills) */
function pairHoles(A,B){
  let best=null;
  for(let dr=-4;dr<=4;dr++) for(let dc=-4;dc<=4;dc++){
    const set=new Set(); let ok=true;
    for(const [r,c] of A.cells) set.add(r+','+c);
    for(const [r,c] of B.cells){ const k=(r+dr)+','+(c+dc); if(set.has(k)){ok=false;break;} set.add(k); }
    if(!ok) continue;
    let r0=9,r1=-9,c0=9,c1=-9;
    for(const k of set){ const [r,c]=k.split(',').map(Number); r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c); }
    const h=r1-r0+1, w=c1-c0+1, holes=h*w-set.size;
    if(h>=2&&w>=2&&h<=4&&w<=4&&holes<=1&&(best===null||holes<best)) best=holes;
  }
  return best;
}
const PARTNERS=new Map();
SHAPES.forEach(A=>{ if(!stackable(A)) PARTNERS.set(A,SHAPES.filter(B=>B.n>1&&pairHoles(A,B)!==null)); });
let carry=[];   // awkward pieces from the last tray, whose partners should show up next
function makeHand(density){
  const h=[weightedShape(density),weightedShape(density),weightedShape(density)];
  if(carry.length && Math.random()<CFG.PAIR_CHANCE){
    const ps=PARTNERS.get(carry[(Math.random()*carry.length)|0]);
    if(ps&&ps.length) h[(Math.random()*3)|0]=ps[(Math.random()*ps.length)|0];
  }
  return h;
}
function weightedShape(density){
  const early=trayNo<=CFG.EARLY_TRAYS;
  const w=SHAPES.map(s=>(1/(1+s.n*density*CFG.SMALL_BIAS))*(s.n===1?CFG.SINGLE_WEIGHT:1)
    *(early&&!stackable(s)?CFG.EARLY_AWKWARD:1));
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let i=0;i<SHAPES.length;i++){ r-=w[i]; if(r<=0) return SHAPES[i]; }
  return SHAPES[0];
}
function pickTier(a){
  if(tension>CFG.TIER_SWEEP && sweepCool<=0) return 'sweep';
  if(tension>CFG.TIER_JACKPOT) return 'jackpot';
  if(tension>CFG.TIER_SOLVABLE) return 'solvable';
  return 'honest';
}
/* the candidate search: the best-scoring playable hand for a tier, plus its solver result */
function pickHand(a0,density,tier,withStar){
  const want = tier==='jackpot'?3 : tier==='solvable'?2 : 0;
  let bestHand=null,bestEv=null,bestScore=-Infinity,bestRough=999;
  for(let i=0;i<CFG.CANDIDATES;i++){
    const hand=makeHand(density);
    if(withStar) hand[(Math.random()*3)|0]=STAR;      // graded with the star in it, so the score is honest
    const ev=evalHand(a0,hand,CFG.NODE_BUDGET);
    let sc;
    if(!ev.ok) sc=-100+ev.lines;                      // all three must be playable
    else if(tier==='honest') sc=10-CFG.TIDY*ev.rough;   // any playable hand, prefer the tidiest
    else sc=(ev.sweep?60:0)+ev.lines*10+ev.cleared*1.5-CFG.TIDY*ev.rough;
    if(sc>bestScore){ bestScore=sc; bestHand=hand; bestEv=ev; }
    if(ev.ok && i>=7 && tier!=='honest' && ev.lines>=want && ev.rough<=bestRough) break;
    if(ev.ok && ev.rough<bestRough) bestRough=ev.rough;
  }
  if(!bestHand){ bestHand=[weightedShape(density),weightedShape(density),weightedShape(density)]; bestEv=null; }
  return {hand:bestHand,ev:bestEv};
}
/* golden hand: a planned sweep if one can be built, else the best jackpot hand.
   Returns false (and deals nothing) if neither offers a real clear. */
function genGolden(a0,density){
  let hand=planSweep(a0), ev=hand&&evalHand(a0,hand,6000);
  if(hand&&ev.sweep){ sweepCool=CFG.SWEEP_COOLDOWN; tension=0.5; }   // same bookkeeping as a normal sweep hand
  else ({hand,ev}=pickHand(a0,density,'jackpot'));
  if(!ev||!ev.ok||(!ev.sweep&&ev.lines<1)) return false;
  commitTray(hand,'GOLDEN·'+(ev.sweep?'SWEEP':'JACKPOT'),{sweep:ev.sweep,lines:ev.lines});
  return true;
}
function genTray(){
  trayNo++;
  if(CFG.TRANSFORM_ENABLED && Math.random()<CFG.MYSTERY_CHANCE)
    triggerTransform(TRANSFORM_IDS[(Math.random()*TRANSFORM_IDS.length)|0]);
  const a0=packGrid(grid);
  const density=countFlat(a0)/(N*N);
  let tier=pickTier(a0);
  sweepCool=Math.max(0,sweepCool-1);
  goldenCool=Math.max(0,goldenCool-1);
  transformCool=Math.max(0,transformCool-1);

  // a star is dealt on ordinary trays only; a golden or sweep tray leaves a guaranteed one waiting
  const wantStar=CFG.STAR_ENABLED && (starForced || Math.random()<CFG.STAR_CHANCE);

  if(goldenNext){ goldenNext=false; if(genGolden(a0,density)) return; }

  if(tier==='sweep'){
    const h=planSweep(a0);
    if(h){ commitTray(h,'SWEEP'); sweepCool=CFG.SWEEP_COOLDOWN; tension=0.5; return; }
    tier='jackpot';
  }

  const {hand}=pickHand(a0,density,tier,wantStar);
  if(hand.includes(STAR)) starForced=false;
  commitTray(hand,tier.toUpperCase()+(hand.includes(STAR)?'+STAR':''));
}
/* rescue hand: playable, and rich in clears (sweep if one can be built) */
function genRescue(){
  const a0=packGrid(grid);
  const density=countFlat(a0)/(N*N);
  const sw=planSweep(a0);
  if(sw){ commitTray(sw,'RESCUE·SWEEP'); return; }
  let bestHand=null,bestScore=-Infinity;
  for(let i=0;i<CFG.CANDIDATES*8;i++){
    const hand=[weightedShape(density),weightedShape(density),weightedShape(density)];
    const ev=evalHand(a0,hand,CFG.NODE_BUDGET);
    const sc=ev.ok ? 100+(ev.sweep?60:0)+ev.lines*10
                   : hand.filter(s=>fitsAnywhere(s,grid)).length;
    if(sc>bestScore){ bestScore=sc; bestHand=hand; }
    if(ev.ok && ev.lines>=2) break;
  }
  commitTray(bestHand,'RESCUE');
}
function pushBanner(txt,sub){   // waits its turn if another banner is still on screen
  banners.push({t:banners.length?-0.55:0,txt,sub});
}
/* praise: a big word for a multi-line clear or a long combo — the bigger the
   moment, the bigger the word. A clean sweep has its own banner instead. */
const PRAISE=[
  null,
  {words:['GOOD JOB!','NICE!'],        a:'#C8FFB8', b:'#26B865'},
  {words:['GREAT!','SUPER!'],          a:'#C2F3FF', b:'#3478FF'},
  {words:['AMAZING!','FANTASTIC!'],    a:'#FFD0F4', b:'#A64BFF'},
  {words:['INCREDIBLE!','LEGENDARY!'], a:'#FFF7B0', b:'#FF6A2B'}
];
function praiseTier(lines,combo){
  const byLines=lines>=5?4:lines>=4?3:lines>=3?2:lines>=2?1:0;
  const byCombo=combo>=8?4:combo>=6?3:combo>=4?2:combo>=3?1:0;
  return Math.max(byLines,byCombo);
}
function praise(lines,combo){
  const tier=praiseTier(lines,combo); if(!tier) return;
  const P=PRAISE[tier], word=P.words[(Math.random()*P.words.length)|0];
  praises.length=0;                                 // newest wins — words never stack up
  praises.push({t:0,tier,word,a:P.a,b:P.b});
  const x=W/2, y=by+B*0.3;
  for(let k=0;!reduce&&k<8+tier*6;k++){
    const ang=Math.random()*6.283, sp=2.5+Math.random()*(3+tier*1.6);
    bursts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp*0.75,life:1,
      r:cell*(0.1+Math.random()*0.13),col:Math.random()<.5?P.a:P.b});
  }
  if(tier>=3) waves.push({x,y,t:0});
  Sfx.praise(tier);
}
function commitTray(shapes,label,plan){
  tray=shapes.map(s=>({s,gi:s.star?STAR_GI:plan?GOLD:(Math.random()*NCOLOR)|0}));
  golden=plan?{want:plan,got:{lines:0,sweep:false},pts:0}:null;
  if(plan){
    goldenCool=CFG.GOLDEN_COOLDOWN;
    pushBanner('GOLDEN HAND','×'+CFG.GOLDEN_MULT+' if you find it');
    Sfx.goldenIn();
  }
  lastTier=label;
  carry=shapes.filter(x=>!stackable(x));
  updateDbg();
}
// forgiving success rule: one line short of the plan is fine (min 1); a planned sweep needs a sweep or 3+ lines
const goldenNeed=w=>w.sweep?'sweep or 3 lines':Math.max(1,w.lines-1)+' lines';
function goldenResult(g){         // {hit: found the plan, mult: 1 = missed entirely}
  const hit=g.want.sweep?(g.got.sweep||g.got.lines>=3):g.got.lines>=Math.max(1,g.want.lines-1);
  if(hit) return {hit,mult:Math.max(CFG.GOLDEN_MULT,CFG.GOLDEN_PARTIAL)};
  return {hit,mult:g.got.lines>0||g.got.sweep?CFG.GOLDEN_PARTIAL:1};
}
function updateDbg(){
  const d=el('dbg');
  d.hidden=!CFG.SHOW_TENSION;
  if(d.hidden) return;
  const gold=golden?`GOLDEN plan ${golden.want.sweep?'sweep':golden.want.lines+' lines'}, need ${goldenNeed(golden.want)}, got ${golden.got.sweep?'sweep+':''}${golden.got.lines} lines, ${golden.pts} pts`
    :goldenNext?'gold queued':goldenCool>0?`gold cooldown ${goldenCool}`:'gold ready';
  const star=!CFG.STAR_ENABLED?'star off':starForced?'star guaranteed':'star on';
  d.textContent=`tension ${tension.toFixed(2)} · ${lastTier} · ${gold} · ${star}`;
}

/* ═══════ layout + tiles ═══════ */
function roundPath(x,px,py,w,h,r){
  const k=Math.min(r,w/2,h/2);
  x.beginPath(); x.moveTo(px+k,py);
  x.arcTo(px+w,py,px+w,py+h,k); x.arcTo(px+w,py+h,px,py+h,k);
  x.arcTo(px,py+h,px,py,k); x.arcTo(px,py,px+w,py,k); x.closePath();
}
function newTile(size){
  const cv=document.createElement('canvas');
  const px=Math.max(10,Math.round(size*dpr));
  cv.width=cv.height=px;
  const x=cv.getContext('2d'); x.scale(px/size,px/size);
  return {cv,x};
}
function starPath(x,cx,cy,R){
  x.beginPath();
  for(let k=0;k<10;k++){
    const a=-Math.PI/2+k*Math.PI/5, rad=k%2?R*0.46:R;
    k?x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):x.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  x.closePath();
}
function heartPath(x,cx,cy,R){
  x.beginPath(); x.moveTo(cx,cy+R*0.85);
  x.bezierCurveTo(cx-R*1.3,cy+R*0.05, cx-R*0.9,cy-R*0.95, cx,cy-R*0.35);
  x.bezierCurveTo(cx+R*0.9,cy-R*0.95, cx+R*1.3,cy+R*0.05, cx,cy+R*0.85);
  x.closePath();
}
// prismatic five-point star, used by the star gem (shiny outline in jewel, none in clay)
function drawStar(x,cx,cy,R,shiny){
  starPath(x,cx,cy,R);
  const gr=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  ['#FF8FB8','#FFD98A','#9CF0B5','#8FD8FF','#B79CFF'].forEach((c,k,a)=>gr.addColorStop(k/(a.length-1),c));
  x.fillStyle=gr; x.fill();
  x.lineJoin='round'; x.lineWidth=Math.max(1,R*0.12);
  x.strokeStyle=shiny?'rgba(255,255,255,.95)':'rgba(120,90,170,.3)'; x.stroke();
}
// face motif: a plain translucent stamp, same on every skin/colour so it never fights the gem underneath
function stampMotif(cv,size,motif){
  if(motif==='none') return;
  const x=cv.getContext('2d'), cx=size/2, cy=size/2, R=size*0.24;
  x.save();
  x.globalAlpha=.55; x.fillStyle='rgba(255,255,255,.92)';
  x.strokeStyle='rgba(0,0,0,.22)'; x.lineWidth=Math.max(1,size*0.02);
  if(motif==='circle'){ x.beginPath(); x.arc(cx,cy,R,0,6.283); x.fill(); x.stroke(); }
  else if(motif==='star'){ starPath(x,cx,cy,R); x.fill(); x.stroke(); }
  else if(motif==='heart'){ heartPath(x,cx,cy,R); x.fill(); x.stroke(); }
  x.restore();
}
// Hard facets: lit top, shadowed bottom, angled sides, specular.
function jewelTile(size,g){
  const {cv,x}=newTile(size);
  const L=g.star?d=>`hsl(${g.h} ${g.s}% ${clamp(90+d*.5,40,99)}%)`     // near-white, facets kept subtle
                 :d=>`hsl(${g.h} ${g.s}% ${clamp(57+d,5,96)}%)`;
  const pad=size*0.055, S=size-pad*2, i=S*0.25;
  const o=[[pad,pad],[pad+S,pad],[pad+S,pad+S],[pad,pad+S]];
  const n=[[pad+i,pad+i],[pad+S-i,pad+i],[pad+S-i,pad+S-i],[pad+i,pad+S-i]];
  x.save(); roundPath(x,pad,pad,S,S,S*0.25); x.clip();
  x.fillStyle=L(0); x.fillRect(pad,pad,S,S);
  const face=(a,b,c,d,dl)=>{ x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]);
    x.lineTo(c[0],c[1]); x.lineTo(d[0],d[1]); x.closePath(); x.fillStyle=L(dl); x.fill(); };
  face(o[0],o[1],n[1],n[0],24); face(o[3],o[0],n[0],n[3],7);
  face(o[1],o[2],n[2],n[1],-13); face(o[2],o[3],n[3],n[2],-27);
  const gr=x.createLinearGradient(n[0][0],n[0][1],n[2][0],n[2][1]);
  gr.addColorStop(0,L(18)); gr.addColorStop(1,L(-5));
  x.fillStyle=gr; x.fillRect(n[0][0],n[0][1],S-i*2,S-i*2);
  if(g.star) drawStar(x,size/2,size/2,S*0.4,true);
  x.globalAlpha=g.gold?.8:.5; x.fillStyle='#fff';
  roundPath(x,pad+S*0.3,pad+S*0.29,S*0.22,S*0.13,S*0.065); x.fill();
  x.globalAlpha=1; x.restore();
  roundPath(x,pad,pad,S,S,S*0.25);
  x.strokeStyle=L(26); x.lineWidth=Math.max(1,size*0.035); x.stroke();
  return cv;
}
// Matte, fat corners, soft shadow underneath — no shine anywhere.
function clayTile(size,g){
  const {cv,x}=newTile(size);
  const L=d=>`hsl(${g.h} ${Math.round(g.s*(g.gold?0.92:0.6))}% ${clamp((g.star?90:61)+d,8,96)}%)`;
  const pad=size*0.1, S=size-pad*2, R=S*0.34;
  x.save();
  x.shadowColor=`hsla(${g.h} 55% 16% / .5)`;
  x.shadowBlur=size*0.14; x.shadowOffsetY=size*0.06;
  roundPath(x,pad,pad,S,S,R); x.fillStyle=L(0); x.fill();
  x.restore();
  x.save(); roundPath(x,pad,pad,S,S,R); x.clip();
  const gr=x.createLinearGradient(0,pad,0,pad+S);
  gr.addColorStop(0,L(12)); gr.addColorStop(.58,L(0)); gr.addColorStop(1,L(-10));
  x.fillStyle=gr; x.fillRect(pad,pad,S,S);
  if(g.star) drawStar(x,size/2,size/2,S*0.4,false);
  x.globalAlpha=.16; x.fillStyle='#fff';
  roundPath(x,pad+S*0.12,pad+S*0.1,S*0.76,S*0.22,S*0.11); x.fill();
  x.globalAlpha=1; x.restore();
  return cv;
}
// Glossy near-circle with a candy-stripe twist and a bright gloss highlight.
function candyTile(size,g){
  const {cv,x}=newTile(size);
  const L=d=>`hsl(${g.h} ${g.s}% ${clamp((g.star?88:58)+d,8,97)}%)`;
  const pad=size*0.07, S=size-pad*2, R=S*0.5, cx=pad+S/2, cy=pad+S/2;
  x.save();
  x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=size*0.08; x.shadowOffsetY=size*0.04;
  x.beginPath(); x.arc(cx,cy,R,0,6.283); x.fillStyle=L(0); x.fill();
  x.restore();
  x.save(); x.beginPath(); x.arc(cx,cy,R,0,6.283); x.clip();
  x.translate(cx,cy); x.rotate(-0.6);
  x.fillStyle=`hsla(${g.h} ${g.s}% 90% / .35)`;
  for(let i=-2;i<=2;i++) x.fillRect(i*S*0.32-S*0.07,-S,S*0.13,S*2);
  x.rotate(0.6); x.translate(-cx,-cy);
  const gr=x.createRadialGradient(cx-S*0.15,cy-S*0.2,1,cx-S*0.15,cy-S*0.2,S*0.5);
  gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,R,0,6.283); x.fill();
  if(g.star) drawStar(x,size/2,size/2,S*0.32,true);
  x.restore();
  x.beginPath(); x.arc(cx,cy,R,0,6.283);
  x.strokeStyle=L(-18); x.lineWidth=Math.max(1,size*0.03); x.stroke();
  return cv;
}
// Translucent slab: a soft colour tint, a diagonal glossy streak, thin bright edge.
function glassTile(size,g){
  const {cv,x}=newTile(size);
  const pad=size*0.08, S=size-pad*2, R=S*0.22;
  roundPath(x,pad,pad,S,S,R);
  const grad=x.createLinearGradient(pad,pad,pad+S,pad+S);
  grad.addColorStop(0,`hsla(${g.h} ${g.s}% 75% / .55)`); grad.addColorStop(1,`hsla(${g.h} ${g.s}% 45% / .35)`);
  x.fillStyle=grad; x.fill();
  x.save(); roundPath(x,pad,pad,S,S,R); x.clip();
  x.fillStyle='rgba(255,255,255,.5)'; x.beginPath();
  x.moveTo(pad+S*0.1,pad+S*0.85); x.lineTo(pad+S*0.4,pad+S*0.1);
  x.lineTo(pad+S*0.55,pad+S*0.1); x.lineTo(pad+S*0.25,pad+S*0.85); x.closePath(); x.fill();
  if(g.star) drawStar(x,size/2,size/2,S*0.34,true);
  x.restore();
  roundPath(x,pad,pad,S,S,R);
  x.strokeStyle=`hsla(${g.h} 40% 95% / .8)`; x.lineWidth=Math.max(1,size*0.035); x.stroke();
  return cv;
}
// Dark tile, glowing outline in the gem's own hue — a sign-tube look.
function neonTile(size,g){
  const {cv,x}=newTile(size);
  const pad=size*0.1, S=size-pad*2, R=S*0.22;
  x.fillStyle='rgba(10,8,18,.92)'; roundPath(x,pad,pad,S,S,R); x.fill();
  x.save();
  x.shadowColor=`hsl(${g.h} 100% 60%)`; x.shadowBlur=size*0.22;
  x.strokeStyle=`hsl(${g.h} 100% ${g.star?85:62}%)`; x.lineWidth=Math.max(1.5,size*0.045);
  roundPath(x,pad,pad,S,S,R); x.stroke(); x.stroke();
  x.restore();
  x.save(); roundPath(x,pad,pad,S,S,R); x.clip();
  const inner=x.createRadialGradient(size/2,size/2,0,size/2,size/2,S*0.6);
  inner.addColorStop(0,`hsla(${g.h} 100% 60% / .28)`); inner.addColorStop(1,'hsla(0 0% 0% / 0)');
  x.fillStyle=inner; x.fillRect(pad,pad,S,S);
  if(g.star) drawStar(x,size/2,size/2,S*0.3,true);
  x.restore();
  return cv;
}
// Chunky retro blocks — flat colour, hard edges, a light/dark bevel pair.
function pixelTile(size,g){
  const {cv,x}=newTile(size);
  x.imageSmoothingEnabled=false;
  const L=d=>`hsl(${g.h} ${g.s}% ${clamp((g.star?85:55)+d,8,95)}%)`;
  const px=Math.max(4,Math.round(size/8)), cells=Math.round(size/px);
  for(let ry=0;ry<cells;ry++) for(let rx=0;rx<cells;rx++){
    const lo=rx===0||ry===0, hi=rx===cells-1||ry===cells-1;
    x.fillStyle=L(lo?16:hi?-16:0);
    x.fillRect(rx*px,ry*px,px,px);
  }
  if(g.star) drawStar(x,size/2,size/2,size*0.28,true);
  return cv;
}
// ─── transformation-only tile styles: each keeps the gem's own hue as its
// fill (so gems stay distinguishable), and layers on a theme accent. Never
// offered on the skins grid — event:true keeps them out of that picker.
// Rainbow: jewel facets plus a translucent rainbow sheen band.
function rainbowTile(size,g){
  const {cv,x}=newTile(size);
  const L=g.star?d=>`hsl(${g.h} ${g.s}% ${clamp(90+d*.5,40,99)}%)`
                 :d=>`hsl(${g.h} ${g.s}% ${clamp(57+d,5,96)}%)`;
  const pad=size*0.06, S=size-pad*2, R=S*0.28;
  x.save(); roundPath(x,pad,pad,S,S,R); x.clip();
  const gr=x.createLinearGradient(pad,pad,pad+S,pad+S);
  gr.addColorStop(0,L(20)); gr.addColorStop(1,L(-10));
  x.fillStyle=gr; x.fillRect(pad,pad,S,S);
  x.save(); x.translate(pad+S/2,pad+S/2); x.rotate(-0.55);
  const rb=x.createLinearGradient(-S,0,S,0);
  ['#FF6B8A','#FFC15C','#FFEB6B','#7DE38A','#6BC5FF','#B08BFF'].forEach((c,i,a)=>rb.addColorStop(i/(a.length-1),c));
  x.globalAlpha=0.4; x.fillStyle=rb; x.fillRect(-S,-S*0.16,S*2,S*0.32);
  x.restore();
  if(g.star) drawStar(x,size/2,size/2,S*0.36,true);
  x.globalAlpha=.5; x.fillStyle='#fff';
  roundPath(x,pad+S*0.3,pad+S*0.29,S*0.22,S*0.13,S*0.065); x.fill();
  x.globalAlpha=1; x.restore();
  roundPath(x,pad,pad,S,S,R);
  x.strokeStyle=L(26); x.lineWidth=Math.max(1,size*0.035); x.stroke();
  return cv;
}
// Gold Vault: the usual jewel facets, framed with ornate gold corner accents.
function goldVaultTile(size,g){
  const {cv,x}=newTile(size);
  const L=g.star?d=>`hsl(${g.h} ${g.s}% ${clamp(90+d*.5,40,99)}%)`
                 :d=>`hsl(${g.h} ${g.s}% ${clamp(57+d,5,96)}%)`;
  const pad=size*0.055, S=size-pad*2, i=S*0.25;
  const o=[[pad,pad],[pad+S,pad],[pad+S,pad+S],[pad,pad+S]];
  const n=[[pad+i,pad+i],[pad+S-i,pad+i],[pad+S-i,pad+S-i],[pad+i,pad+S-i]];
  x.save(); roundPath(x,pad,pad,S,S,S*0.25); x.clip();
  x.fillStyle=L(0); x.fillRect(pad,pad,S,S);
  const face=(a,b,c,d,dl)=>{ x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]);
    x.lineTo(c[0],c[1]); x.lineTo(d[0],d[1]); x.closePath(); x.fillStyle=L(dl); x.fill(); };
  face(o[0],o[1],n[1],n[0],24); face(o[3],o[0],n[0],n[3],7);
  face(o[1],o[2],n[2],n[1],-13); face(o[2],o[3],n[3],n[2],-27);
  const gr=x.createLinearGradient(n[0][0],n[0][1],n[2][0],n[2][1]);
  gr.addColorStop(0,L(18)); gr.addColorStop(1,L(-5));
  x.fillStyle=gr; x.fillRect(n[0][0],n[0][1],S-i*2,S-i*2);
  if(g.star) drawStar(x,size/2,size/2,S*0.4,true);
  x.globalAlpha=.5; x.fillStyle='#fff';
  roundPath(x,pad+S*0.3,pad+S*0.29,S*0.22,S*0.13,S*0.065); x.fill();
  x.globalAlpha=1; x.restore();
  x.globalAlpha=.8; x.fillStyle='#FFD45C';                 // small corner accents, not a full ring
  const k=S*0.13;
  [[pad,pad,1,1],[pad+S,pad,-1,1],[pad+S,pad+S,-1,-1],[pad,pad+S,1,-1]].forEach(([cx,cy,sx,sy])=>{
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+sx*k,cy); x.lineTo(cx,cy+sy*k); x.closePath(); x.fill();
  });
  x.globalAlpha=.6;
  roundPath(x,pad,pad,S,S,S*0.25);
  x.strokeStyle='#FFD45C'; x.lineWidth=Math.max(1,size*0.025); x.stroke();
  x.globalAlpha=1;

function layout(){

/* ═══════ audio ═══════
   Fully synthesized. Chain: voices -> master gain -> compressor -> out,
   so stacked sounds (a sweep on top of a combo) don't clip. One shared
   noise buffer is built when the context is created (first user gesture,
   which browsers require) and reused by every noise hit.
   ═══════════════════════════════════════════════════════════════ */
let actx=null,muted=false,master=null,nbuf=null,revIn=null;
/* The whole chain, built on whatever context it's handed (the live one, or an
   offline one for rendering/tests): sounds -> master -> soft high-shelf ->
   compressor -> out, plus a reverb send that any sound can feed via `wet`.
   The reverb is a synthetic room — decaying stereo noise — so it costs no
   file and gives the musical sounds some air instead of sitting bone-dry. */
function buildChain(c){
  const m=c.createGain(); m.gain.value=1;
  const tame=c.createBiquadFilter(); tame.type='highshelf'; tame.frequency.value=7500; tame.gain.value=-5;
  const comp=c.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=10; comp.ratio.value=3.5;
  comp.attack.value=.004; comp.release.value=.18;
  m.connect(tame); tame.connect(comp); comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*1.5), ir=c.createBuffer(2,len,c.sampleRate), fade=c.sampleRate*.006;
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)*(i<fade?i/fade:1);
  }
  const conv=c.createConvolver(); conv.buffer=ir;
  const rin=c.createGain(), dark=c.createBiquadFilter();
  dark.type='lowpass'; dark.frequency.value=4800;                  // a darker tail sits behind the dry sound
  rin.connect(conv); conv.connect(dark); dark.connect(comp);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;             // 1s of white noise, shared by every noise hit
  return {master:m,revIn:rin,nbuf:nb};
}
function ac(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); ({master,revIn,nbuf}=buildChain(actx)); }
  if(actx.state==='suspended') actx.resume().catch(()=>{});

const jit=()=>1+(Math.random()*.06-.03);            // ±3% pitch per trigger — physical sounds only, never musical ones
const hz=f=>clamp(f,20,12000);
function send(node,wet){                             // dry to master, plus `wet` of it into the reverb
  node.connect(master);
  if(wet){ const w=actx.createGain(); w.gain.value=wet; node.connect(w); w.connect(revIn); }
}

/* filtered noise slice with its own envelope; f0 -> f1 sweeps the filter.
   Used both as the attack transient on every sound and as bursts/washes. */
function noiseHit(t,{dur=.012,f0=3000,f1=f0,q=1,vol=.1,type='bandpass',wet=0}){
  const c=actx, src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=nbuf; f.type=type; f.Q.value=q;
  f.frequency.setValueAtTime(hz(f0),t);
  if(f1!==f0) f.frequency.exponentialRampToValueAtTime(hz(f1),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.004,dur/3));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); send(g,wet);
  src.start(t,Math.random()*(nbuf.duration-dur-.05)); src.stop(t+dur+.01);

/* 2-3 detuned oscillators with a pitch envelope (f0 -> f1 over `pdur`),
   through a resonant bandpass whose centre also sweeps (bp0 -> bp1 over
   `pdur`). `dur` is the amplitude decay and can outlast the pitch move —
   a short, sharp pitch drop under a longer ring (pdur defaults to dur). */
function voice(t,{f0,f1=f0,dur,pdur=dur,vol,bp0,bp1=bp0,q=4,type='sawtooth',det=[-8,0,8],atk=.005,wet=0}){
  const c=actx, out=c.createGain(), bp=c.createBiquadFilter();

  bp.frequency.exponentialRampToValueAtTime(hz(bp1),t+pdur);
  out.gain.setValueAtTime(.0001,t);
  out.gain.exponentialRampToValueAtTime(vol/det.length,t+atk);
  out.gain.exponentialRampToValueAtTime(.0001,t+dur);
  bp.connect(out); send(out,wet);
  for(const cents of det){
    const o=c.createOscillator();
    o.type=type; o.detune.value=cents;
    o.frequency.setValueAtTime(hz(f0),t);
    o.frequency.exponentialRampToValueAtTime(hz(f1),t+pdur);

function tone(t,{f0,f1=f0,pdur=.03,dur=.1,vol=.1,atk=.002,type='sine',wet=0}){
  const o=actx.createOscillator(), g=actx.createGain();

/* a struck bell: pure sine partials, each with its own exponential decay.

const BELLS={            // [frequency ratio, amplitude, share of the note's decay]
  glock:  [[1,1,1],[2.76,.32,.5],[5.4,.13,.3],[8.93,.05,.18]],

function bell(t,{f,dur=.9,vol=.08,wet=.25,kind='glock',atk=.003}){

    o.type='sine'; o.frequency.value=fr;

/* place: a physical snap, not a tonal sweep — sharp click, short sine body

  }); },
  goldenWin(){ play(.15,t=>{
    voice(t,{f0:130,f1:58,dur:.7,vol:.3,bp0:260,bp1:100,q:1,type:'sine',det:[0],wet:.1});    // boom
    for(let i=0;i<8;i++) bell(t+.04+i*.055,{f:note(3+i),dur:.5,vol:.05,wet:.35});           // rising run
    const tc=t+.5;
    [5,7,8,10,13].forEach((st,i)=>bell(tc+i*.015,{f:note(st),dur:1.9,vol:.055,wet:.45}));
    for(let i=0;i<9;i++) noiseHit(tc+.05+i*.07,{dur:.045,f0:6500+Math.random()*3500,q:10,vol:.018,wet:.5});
