el('mute').onclick=e=>{e.stopPropagation();muted=!muted;el('mute').textContent=muted?'🔈':'🔊';};

/* ═══════ game logic ═══════ */
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
function canPlace(s,r,c,g){
  if(r<0||c<0||r+s.rows>N||c+s.cols>N) return false;
  for(const [dr,dc] of s.cells) if(g[r+dr][c+dc]) return false;
  return true;
}
function fitsAnywhere(s,g){
  for(let r=0;r<=N-s.rows;r++) for(let c=0;c<=N-s.cols;c++) if(canPlace(s,r,c,g)) return true;
  return false;
}
function linesFor(g){
  const rows=[],cols=[];
  for(let r=0;r<N;r++) if(g[r].every(v=>v)) rows.push(r);
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++) if(!g[r][c]){f=false;break;} if(f) cols.push(c);}
  return {rows,cols};
}
function mobility(){
  let n=0; for(const s of SHAPES) if(fitsAnywhere(s,grid)) n++;
  return n/SHAPES.length;
}

// ═══ transformations — achievement-triggered event looks (own world + own tile skin) ═══
function triggerTransform(id){
  if(!CFG.TRANSFORM_ENABLED) return;
  if(!transform && transformCool>0) return;   // quiet period after one ends — makes the next feel earned
  const first=!discoveredWorlds.has(id);
  transform={id,remaining:CFG.TRANSFORM_PLACEMENTS};
  startFlip(id,TRANSFORMS[id].skin);
  Sfx.transformShift();
  if(first){ discoveredWorlds.add(id); saveSkinSave(); renderWorlds(); }
  pushBanner(TRANSFORMS[id].name.toUpperCase(),first?'New world discovered!':'×'+CFG.TRANSFORM_MULT+' SCORE');
  renderPips();
}
function endTransform(){
  transform=null;
  transformCool=CFG.TRANSFORM_COOLDOWN;
  startFlip(CFG.HOME_WORLD,CFG.STYLE);
  renderPips();
}
function renderPips(){
  const box=el('transformPips'), n=CFG.TRANSFORM_PLACEMENTS;
  if(!transform){ box.hidden=true; return; }
  box.hidden=false;
  if(box.dataset.n!==String(n)){                    // n pips, then the multiplier label
    box.innerHTML=''; box.dataset.n=n;
    for(let i=0;i<n;i++) box.append(document.createElement('div'));
    const m=document.createElement('span'); m.className='mult'; box.append(m);
  }
  const kids=[...box.children];
  for(let i=0;i<n;i++) kids[i].className='pip'+(i<transform.remaining?' on':'');
  kids[n].textContent='×'+CFG.TRANSFORM_MULT;
}
function place(idx,r,c){
  // countdown first, on whatever was already active — a fresh trigger below overrides this placement's result
  if(transform){ transform.remaining--; if(transform.remaining<=0) endTransform(); }
  const t=tray[idx],s=t.s;
  if(!s.star) s.cells.forEach(([dr,dc],k)=>{ grid[r+dr][c+dc]={gi:t.gi,t:-k*0.06}; });   // a star leaves no gem
  tray[idx]=null;
  if(!s.star) Sfx.place(s.n);

  let rows,cols;
  if(s.star){                                     // its whole row and column, full or not (each counts if it held a gem)
    rows=grid[r].some(v=>v)?[r]:[];
    cols=grid.some(row=>row[c])?[c]:[];
  } else ({rows,cols}=linesFor(grid));
  const total=rows.length+cols.length;
  let gained=s.n, swept=false;

  if(s.star){
    blasts.push({r,c,t:0});
    waves.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,t:0});
    for(let k=0;!reduce&&k<10;k++){
      const along=Math.random()*B, onRow=k%2===0;
      sparkles.push({x:onRow?bx+along:bx+(c+.5)*cell,y:onRow?by+(r+.5)*cell:by+along,t:Math.random()*0.5});
    }
    Sfx.star();
  }

  if(total>0){
    ambientBurst=1;
    if(CFG.FX_PUNCH_ZOOM && !reduce && total>=2) punchT=1;
    if(s.star && total>=2) triggerTransform('starfield');
    combo++; trayCombo=Math.max(trayCombo,combo);
    if(CFG.STAR_ENABLED && combo>=CFG.STAR_COMBO) starForced=true;
    if(combo>=5) triggerTransform('volcano');
    if(combo>=7) triggerTransform('storm');
    gained+=Math.round(CFG.LINE_POINTS*total*total*(1+(combo-1)*CFG.COMBO_STEP));
    if(!s.star){                                   // a star gets its own cross-shaped blast instead
      rows.forEach(r2=>sweeps.push({horiz:true,idx:r2,t:0}));
      cols.forEach(c2=>sweeps.push({horiz:false,idx:c2,t:0}));
    }

    const marked=new Map();
    rows.forEach(r2=>{for(let i=0;i<N;i++) marked.set(r2+','+i,i);});
    cols.forEach(c2=>{for(let i=0;i<N;i++) marked.set(i+','+c2,i);});
    let lastGi=t.gi, cleared=0;
    marked.forEach((along,key)=>{
      const [rr,cc]=key.split(',').map(Number);
      const g=grid[rr][cc]; if(!g) return;
      lastGi=g.gi; cleared++;
      shatters.push({r:rr,c:cc,gi:g.gi,t:-(0.14+along*0.035)});
      grid[rr][cc]=null;
    });

    const cr=r+s.rows/2, cc0=c+s.cols/2;
    waves.push({x:bx+cc0*cell,y:by+cr*cell,t:0});
    glowT=1; glowH=GEMS[lastGi].h;
    if(!s.star){                                   // each cleared line flares in the colour it was cleared with
      const k=Math.min(1.7,0.8+0.3*total);
      rows.forEach(r2=>lineFlashes.push({horiz:true,idx:r2,t:0,hue:glowH,k}));
      cols.forEach(c2=>lineFlashes.push({horiz:false,idx:c2,t:0,hue:glowH,k}));
    }
    shake=Math.min(11,3.5+total*1.8)*CFG.SHAKE;
    if(s.star) shake=Math.max(shake,12*CFG.SHAKE);
    if(combo>1) Sfx.combo(combo,total); else Sfx.clear(total);
    pops.push({x:bx+cc0*cell,y:by+cr*cell,t:0,txt:'+'+(gained-s.n),
               sub:combo>1?'COMBO ×'+combo:(total>1?total+' LINES':''),combo,lines:total});

    // clean sweep — board completely emptied
    let anyLeft=false;
    for(let rr=0;rr<N&&!anyLeft;rr++) for(let cc=0;cc<N;cc++) if(grid[rr][cc]){anyLeft=true;break;}
    if(!anyLeft){
      const bonus=CFG.SWEEP_BONUS+cleared*CFG.SWEEP_PER_GEM;
      gained+=bonus;
      swept=true; trayHadSweep=true;
      ambientBurst=1.8;
      if(CFG.FX_SWEEP_FX){ sweepFxT=1; spawnConfetti(); }
      pushBanner('CLEAN SWEEP','+'+bonus);         // the achievement first, then the world it earns
      triggerTransform('rainbow');
      for(let k=0;k<4;k++) waves.push({x:W/2,y:by+B/2,t:-k*0.18});
      shake=16*CFG.SHAKE; glowT=1.6;
      Sfx.sweep();
      tension=0;
    }
    if(!swept) praise(total,combo);
    tension=Math.max(0,tension-CFG.TENSION_DOWN);
  } else {
    combo=0;
    tension=Math.min(1,tension+CFG.TENSION_UP);
  }

  tension=Math.min(1,tension+(1-mobility())*CFG.TENSION_DRIFT);

  if(golden){
    golden.got.lines+=total; if(swept) golden.got.sweep=true;
    golden.pts+=gained;
    if(tray.every(v=>!v)){
      const {hit:full,mult}=goldenResult(golden);
      if(mult>1){                                      // any clear pays at least the partial multiplier
        const extra=Math.round(golden.pts*(mult-1));
        gained+=extra;
        pushBanner('GOLDEN ×'+(+mult.toFixed(1)),'+'+extra);
        if(full){                                      // found it: the big celebration
          for(let k=0;k<5;k++) waves.push({x:W/2,y:by+B/2,t:-k*0.14});
          for(let k=0;!reduce&&k<16;k++) sparkles.push({x:bx+Math.random()*B,y:by+Math.random()*B,t:Math.random()*0.5});
          shake=14*CFG.SHAKE; glowT=2; Sfx.goldenWin();
          triggerTransform('goldvault');
        } else {                                       // partial credit: a smaller version
          for(let k=0;k<2;k++) waves.push({x:W/2,y:by+B/2,t:-k*0.14});
          for(let k=0;!reduce&&k<6;k++) sparkles.push({x:bx+Math.random()*B,y:by+Math.random()*B,t:Math.random()*0.5});
          glowT=1.3; Sfx.goldenIn();
        }
        glowH=GEMS[GOLD].h;
      }
      golden=null;                                     // a miss costs nothing; the hand just ends
    }
  }
  if(transform) gained=Math.round(gained*CFG.TRANSFORM_MULT);
  updateDbg(); renderPips();

  score+=gained; el('scoreVal').textContent=score;
  if(tray.every(v=>!v)){
    goldenNext = CFG.GOLDEN_ENABLED && goldenCool<=0 && (trayHadSweep || trayCombo>=CFG.GOLDEN_COMBO || Math.random()<CFG.GOLDEN_CHANCE);
    trayHadSweep=false; trayCombo=0;
    genTray();
  }
  if(!tray.some(v=>v&&fitsAnywhere(v.s,grid))) setTimeout(gameOver,700);
}

/* ═══════ input ═══════ */
// a tray piece's cell size: as big as trayCell allows, but a 5-long bar still fits its slot
const trayFit=s=>Math.min(trayCell,(B/3)*0.9/s.cols,trayH*0.9/s.rows);
function slotRect(i){ const w=B/3; return {x:bx+w*i,y:trayY,w,h:trayH}; }
function onDown(e){
  if(state!=='play'||paused) return;
  ac();
  for(let i=0;i<3;i++){
    const R=slotRect(i);
    if(tray[i]&&e.clientX>=R.x&&e.clientX<=R.x+R.w&&e.clientY>=R.y-12&&e.clientY<=R.y+R.h+12){
      drag={i,x:e.clientX,y:e.clientY,px:e.clientX,vx:0,g:0};
      Sfx.pickup(); return;
    }
  }
}
function onMove(e){
  if(!drag||paused) return;
  drag.vx=drag.vx*0.7+(e.clientX-drag.px)*0.3; drag.px=e.clientX;
  drag.x=e.clientX; drag.y=e.clientY;
}
function onUp(){
  if(!drag||paused) return;
  const t=tray[drag.i];
  if(t){
    let g=ghost();
    if(!g && drag.last && performance.now()-drag.lastT<=CFG.SNAP_GRACE && canPlace(t.s,drag.last.r,drag.last.c,grid)) g=drag.last;
    if(g) place(drag.i,g.r,g.c);
    else{
      const s=t.s, R=slotRect(drag.i);
      ret={i:drag.i,t:0,fx:drag.x-(s.cols*cell)/2,fy:drag.y-cell*CFG.LIFT-(s.rows*cell)/2,fs:cell,
           tx:R.x+(R.w-s.cols*trayFit(s))/2,ty:R.y+(R.h-s.rows*trayFit(s))/2,ts:trayFit(s)};
      Sfx.deny();
    }
  }
  drag=null;
}
function ghost(){
  if(!drag) return null;
  const t=tray[drag.i]; if(!t) return null;
  const s=t.s;
  // piece position in fractional grid cells
  const fc=(drag.x-(s.cols*cell)/2-bx)/cell;
  const fr=(drag.y-cell*CFG.LIFT-(s.rows*cell)/2-by)/cell;
  const dist=(r,c)=>Math.hypot(r-fr,c-fc);
  let g=null;
  // hysteresis: keep the current ghost until the piece moves well away from it
  const cur=drag.gh;
  if(cur && cur.s===s && dist(cur.r,cur.c)<=CFG.SNAP_STICKY && canPlace(s,cur.r,cur.c,grid)) g=cur;
  if(!g){
    // otherwise the closest valid spot within SNAP_RADIUS of the nearest grid position
    const r0=Math.round(fr), c0=Math.round(fc), R=CFG.SNAP_RADIUS;
    let best=Infinity;
    for(let dr=-R;dr<=R;dr++) for(let dc=-R;dc<=R;dc++){
      const r=r0+dr, c=c0+dc, d=dist(r,c);
      if(d<best && canPlace(s,r,c,grid)){ best=d; g={r,c,s}; }
    }
  }
  drag.gh=g;
  if(g){ drag.last=g; drag.lastT=performance.now(); }
  return g;
}
addEventListener('pointerdown',onDown,{passive:true});
addEventListener('pointermove',onMove,{passive:true});
addEventListener('pointerup',onUp,{passive:true});
addEventListener('pointercancel',()=>{drag=null;},{passive:true});

/* ═══════ draw ═══════ */
function gem(gi,x,y,sz,sx,alpha,flash,small,syArg,src){
  const scx=sx||1, scy=syArg===undefined?scx:syArg;
  const w=sz*scx, h=sz*scy;
  const a=alpha===undefined?1:alpha;
  if(a<=0||w<=0||h<=0) return;
  ctx.globalAlpha=a;
  const arr=(src||{big:gemBig,small:gemSmall})[small?'small':'big'];
  ctx.drawImage(arr[gi],x+(sz-w)/2,y+(sz-h)/2,w,h);
  if(flash>0.01){
    ctx.globalAlpha=a*flash; ctx.fillStyle='#fff';
    roundPath(ctx,x+(sz-w)/2+w*.06,y+(sz-h)/2+h*.06,w*.88,h*.88,w*.25); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function star(x,y,r,a){
  ctx.globalAlpha=a; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(x,y-r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
  ctx.fill(); ctx.globalAlpha=1;
}

// golden pieces: a soft pulsing halo behind, and a light band sweeping across the cells
function goldGlow(cx,cy,r,now,ph,rgb='255,206,72'){
  const pulse=reduce?0.6:0.5+0.5*Math.sin(now*0.005+ph);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${rgb},${0.3+0.32*pulse})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
}
// a lifted piece's drop shadow, rendered with shadowBlur once into its own canvas
function pieceShadow(s){
  const pad=24, w=s.cols*cell+pad*2, h=s.rows*cell+pad*2, cv=document.createElement('canvas');
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.shadowColor='rgba(0,0,0,.55)'; x.shadowBlur=18; x.shadowOffsetX=0; x.fillStyle='rgba(0,0,0,.55)';
  x.translate(-1000,0); x.shadowOffsetX=1000*dpr;                 // draw the shape off-canvas so only its shadow lands
  for(const [dr,dc] of s.cells){ roundPath(x,pad+dc*cell+cell*.08,pad+dr*cell+cell*.08,cell*.84,cell*.84,cell*.22); x.fill(); }
  return {cv,pad,w,h};
}
function goldShimmer(now,s,dr,dc){
  if(reduce) return 0;
  const pos=((now*0.0009)%1)*(s.rows+s.cols+3)-1.5;
  return Math.max(0,1-Math.abs(dr+dc-pos)/1.2)*0.6;
}

// screen-edge vignette: bands from each edge only, clamped to stay outside the
// board panel so it can never draw over live gems, however narrow the layout.
function edgeGlow(rgb,strength){
  if(strength<=0.01) return;
  const base=40+strength*70;
  const dT=Math.max(0,Math.min(base,by-12));
  const dB=Math.max(0,Math.min(base,H-(by+B)-12));
  const dL=Math.max(0,Math.min(base,bx-12));
  const dR=dL;
  const mk=(x0,y0,x1,y1)=>{
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,`rgba(${rgb},${0.5*strength})`); g.addColorStop(1,`rgba(${rgb},0)`);
    return g;
  };
  if(dT>2){ ctx.fillStyle=mk(0,0,0,dT); ctx.fillRect(0,0,W,dT); }
  if(dB>2){ ctx.fillStyle=mk(0,H,0,H-dB); ctx.fillRect(0,H-dB,W,dB); }
  if(dL>2){ ctx.fillStyle=mk(0,0,dL,0); ctx.fillRect(0,0,dL,H); }
  if(dR>2){ ctx.fillStyle=mk(W,0,W-dR,0); ctx.fillRect(W-dR,0,dR,H); }
}
// clean-sweep confetti: falls in front, only ever over an already-emptied board
function spawnConfetti(){
  if(reduce) return;
  const cols=['#FFD45C','#FF7BD5','#8FD8FF','#9CF0B5','#FFFFFF'];
  for(let k=0;k<28;k++) confetti.push({
    x:Math.random()*W, y:-20-Math.random()*80, vx:(Math.random()-.5)*1.6, vy:1.4+Math.random()*1.8,
    rot:Math.random()*6.283, vr:(Math.random()-.5)*.3, w:4+Math.random()*4, h:7+Math.random()*6,
    col:cols[(Math.random()*cols.length)|0], life:1
  });
}
function stepConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=0.03*dt; c.rot+=c.vr*dt; c.life-=dt*0.012;
    if(c.life<=0||c.y>H+30){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.globalAlpha=Math.min(1,c.life*2); ctx.fillStyle=c.col;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=paused?0:Math.min(2.5,(now-last)/16.67)||1; last=now;
  shake*=Math.pow(.85,dt); glowT*=Math.pow(.93,dt);

  const comboTarget=combo>=2?Math.min(1,(combo-1)/6):0;
  comboGlowV+=(comboTarget-comboGlowV)*Math.min(1,dt*0.15);
  const goldTarget=golden?1:0;
  goldTintV+=(goldTarget-goldTintV)*Math.min(1,dt*0.15);
  sweepFxT=Math.max(0,sweepFxT-dt/48);
  punchT=Math.max(0,punchT-dt/22);

  stepFlip(dt);
  const [bgTop,bgBot]=bgT>=1 ? [worldDef(curWorld).top,worldDef(curWorld).bottom]
    : [lerpCol(worldDef(bgFrom).top,worldDef(curWorld).top,easeOutCubic(bgT)),
       lerpCol(worldDef(bgFrom).bottom,worldDef(curWorld).bottom,easeOutCubic(bgT))];
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,bgTop); bg.addColorStop(1,bgBot);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ambientBurst*=Math.pow(.88,dt);
  const aboost=1+ambientBurst*1.8;
  if(bgT<1) stepAmbient(ambientOld,worldDef(bgFrom).effect,dt,aboost,1-easeOutCubic(bgT),false);
  stepAmbient(ambient,worldDef(curWorld).effect,dt,aboost,bgT<1?easeOutCubic(bgT):1,true);

  if(worldDef(curWorld).flash && !reduce && Math.random()<0.006*dt) lightningT=1;
  lightningT=Math.max(0,lightningT-dt/10);
  if(lightningT>0.01){ ctx.globalAlpha=lightningT*0.5; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }

  const amb=ctx.createRadialGradient(W/2,by+B/2,0,W/2,by+B/2,B*0.95);
  amb.addColorStop(0,`hsla(${glowH} 90% 60% / ${0.10+glowT*0.34})`);
  amb.addColorStop(1,'hsla(280 90% 60% / 0)');
  ctx.fillStyle=amb; ctx.fillRect(0,0,W,H);

  // background-layer washes: drawn behind the gems, so they tint the scene without ever sitting over a piece
  if(CFG.FX_GOLD_TINT && goldTintV>0.02 && !(transform&&transform.id==='goldvault')){  // Gold Vault's own look already reads gold — don't double it

    const pulse=reduce?0.7:0.6+0.4*Math.sin(now*0.004);
    ctx.globalAlpha=goldTintV*0.09*pulse; ctx.fillStyle='#FFCE48'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  if(CFG.FX_SWEEP_FX && sweepFxT>0){
    ctx.globalAlpha=sweepFxT*0.4; ctx.fillStyle=`hsl(${glowH} 85% 70%)`; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  if(flip && flip.t<14){                          // a brief flash right as a flip begins
    ctx.globalAlpha=(1-flip.t/14)*0.5; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }

  ctx.save();
  if(shake>.2) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(CFG.FX_PUNCH_ZOOM && punchT>0.01){
    const pz=1+0.025*punchT;
    ctx.translate(bx+B/2,by+B/2); ctx.scale(pz,pz); ctx.translate(-(bx+B/2),-(by+B/2));
  }

  ctx.drawImage(boardBg.cv,bx-boardBg.pad,by-boardBg.pad,boardBg.w,boardBg.w);
  if(CFG.FX_TENSION_BORDER){                            // board border glow: calm (cool) -> warm as tension climbs
    const hue=200-185*tension, a=0.45+0.4*tension;       // layered strokes fake the glow — shadowBlur every frame is slow on iOS
    roundPath(ctx,bx-9,by-9,B+18,B+18,20);
    ctx.strokeStyle=`hsla(${hue} 85% 62% / ${a*0.12})`; ctx.lineWidth=12+14*tension; ctx.stroke();
    ctx.strokeStyle=`hsla(${hue} 85% 62% / ${a*0.28})`; ctx.lineWidth=5+6*tension;  ctx.stroke();
    ctx.strokeStyle=`hsla(${hue} 85% 66% / ${a})`;      ctx.lineWidth=2+2*tension;  ctx.stroke();
  }

  const gh=ghost();
  if(gh){
    let L;
    if(gh.s.star) L={rows:[gh.r],cols:[gh.c]};                 // preview the whole cross
    else{
      const test=grid.map(row=>row.slice());
      for(const [dr,dc] of gh.s.cells) test[gh.r+dr][gh.c+dc]=1;
      L=linesFor(test);
    }
    const sh=(Math.sin(now*0.006)*0.5+0.5)*0.18+0.14;
    ctx.globalAlpha=sh; ctx.fillStyle='#fff';
    L.rows.forEach(r=>ctx.fillRect(bx,by+r*cell,B,cell));
    L.cols.forEach(c=>ctx.fillRect(bx+c*cell,by,cell,B));
    ctx.globalAlpha=1;
    for(const [dr,dc] of gh.s.cells)
      gem(tray[drag.i].gi,bx+(gh.c+dc)*cell,by+(gh.r+dr)*cell,cell,.92,.4,0);
  }

  const claySquash=curSkin==='clay';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const g=grid[r][c]; if(!g) continue;
    if(g.t<1) g.t=Math.min(1,g.t+dt*0.085);
    if(g.t<=0) continue;
    const base=0.5+0.5*easeOutBack(g.t);
    const fp=flip?clamp((flip.t-(r+c)/(2*(N-1))*FLIP_WAVE)/FLIP_CELL,0,1):1;
    if(flip && fp<1){                              // mid-flip: squash to a line, swap texture, unsquash
      const half=fp<0.5, sq=half?1-fp*2:(fp-0.5)*2;
      gem(g.gi,bx+c*cell,by+r*cell,cell,base*sq,1,0,false,base,half?{big:flip.fromBig,small:flip.fromSmall}:undefined);
    } else if(claySquash&&g.t<1){
      const q=Math.sin(g.t*Math.PI)*0.17;
      gem(g.gi,bx+c*cell,by+r*cell,cell,base*(1+q),1,0,false,base*(1-q));
    } else gem(g.gi,bx+c*cell,by+r*cell,cell,base,1,0);
  }

  if(!reduce && now-lastSpark>CFG.SPARKLE_RATE && state==='play' && !paused && curSkin==='jewel'){
    lastSpark=now;
    const f=[];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]&&grid[r][c].t>=1) f.push([r,c]);
    if(f.length){
      const [r,c]=f[(Math.random()*f.length)|0];
      sparkles.push({x:bx+(c+.2+Math.random()*.6)*cell,y:by+(r+.2+Math.random()*.6)*cell,t:0});
    }
  }
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i]; s.t+=dt*0.045;
    if(s.t>=1){ sparkles.splice(i,1); continue; }
    const k=Math.sin(s.t*Math.PI); star(s.x,s.y,cell*0.26*k,k*0.9);
  }

  for(let i=sweeps.length-1;i>=0;i--){
    const s=sweeps[i]; s.t+=dt*0.07;
    if(s.t>=1){ sweeps.splice(i,1); continue; }
    const p=easeOutCubic(s.t), a=(1-s.t)*0.85;
    if(s.horiz){
      const x=bx+p*B, g=ctx.createLinearGradient(x-cell*1.6,0,x+cell*0.4,0);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${a})`);
      ctx.fillStyle=g; ctx.fillRect(bx,by+s.idx*cell,p*B,cell);
    } else {
      const y=by+p*B, g=ctx.createLinearGradient(0,y-cell*1.6,0,y+cell*0.4);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${a})`);
      ctx.fillStyle=g; ctx.fillRect(bx+s.idx*cell,by,cell,p*B);
    }
  }

  for(let i=blasts.length-1;i>=0;i--){                 // star blast: prismatic beams out along the row and column
    const b=blasts[i]; b.t+=dt*0.045;
    if(b.t>=1){ blasts.splice(i,1); continue; }
    const p=easeOutCubic(b.t), a=(1-b.t)*0.95, reach=p*B*1.25;
    const cx=bx+(b.c+.5)*cell, cy=by+(b.r+.5)*cell, hue=(b.t*300+200)%360;
    const th=cell*(1.1-0.6*b.t);
    const beam=(x0,y0,x1,y1,horiz)=>{
      const g=horiz?ctx.createLinearGradient(x0,0,x1,0):ctx.createLinearGradient(0,y0,0,y1);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=`hsla(${hue} 100% 70% / ${a*0.5})`;                // colored halo under a white core
      if(horiz) ctx.fillRect(x0,y0-th*0.9,x1-x0,th*1.8); else ctx.fillRect(x0-th*0.9,y0,th*1.8,y1-y0);
      ctx.fillStyle=g;
      if(horiz) ctx.fillRect(x0,y0-th/2,x1-x0,th); else ctx.fillRect(x0-th/2,y0,th,y1-y0);
    };
    beam(Math.max(bx,cx-reach),cy,Math.min(bx+B,cx+reach),cy,true);
    beam(cx,Math.max(by,cy-reach),cx,Math.min(by+B,cy+reach),false);
    const fr=cell*(0.6+1.6*p), fg=ctx.createRadialGradient(cx,cy,0,cx,cy,fr);
    fg.addColorStop(0,`rgba(255,255,255,${a})`); fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fg; ctx.fillRect(cx-fr,cy-fr,fr*2,fr*2);
    ctx.globalAlpha=1;
  }

  for(let i=shatters.length-1;i>=0;i--){
    const s=shatters[i]; s.t+=dt*0.055;
    if(s.t<0){ gem(s.gi,bx+s.c*cell,by+s.r*cell,cell,1,1,0); continue; }
    if(s.t>=1){
      const g=GEMS[s.gi], cx=bx+(s.c+.5)*cell, cy=by+(s.r+.5)*cell;
      for(let k=0;k<(reduce?3:CFG.SHARDS);k++){
        const a=Math.random()*6.283,sp=1.6+Math.random()*5;
        shards.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.4,
          r:cell*(.09+Math.random()*.16),rot:Math.random()*6.283,
          vr:(Math.random()-.5)*.34,life:1,
          col:`hsl(${g.h} ${g.s}% ${46+Math.random()*30}%)`});
      }
      shatters.splice(i,1); continue;
    }
    const e=Math.sin(s.t*Math.PI*0.5);
    gem(s.gi,bx+s.c*cell,by+s.r*cell,cell,1+0.34*e,1-s.t*s.t,e);
  }

  for(let i=shards.length-1;i>=0;i--){
    const b=shards[i];
    b.vy+=.4*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt; b.life-=.021*dt;
    if(b.life<=0){ shards.splice(i,1); continue; }
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
    ctx.globalAlpha=Math.max(0,b.life); ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.moveTo(0,-b.r); ctx.lineTo(b.r*.86,b.r*.5);
    ctx.lineTo(-b.r*.86,b.r*.5); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha=1;

  if(lineFlashes.length){                          // cleared lines flare, additively, in their gem colour
    ctx.globalCompositeOperation='lighter';
    for(let i=lineFlashes.length-1;i>=0;i--){
      const f=lineFlashes[i]; f.t+=dt*0.05;
      if(f.t>=1){ lineFlashes.splice(i,1); continue; }
      const a=(1-f.t)*(1-f.t)*0.5*f.k, grow=cell*(0.1+0.55*easeOutCubic(f.t));
      ctx.fillStyle=`hsla(${f.hue} 100% 66% / ${a})`;
      if(f.horiz) ctx.fillRect(bx-4,by+f.idx*cell-grow/2,B+8,cell+grow);
      else ctx.fillRect(bx+f.idx*cell-grow/2,by-4,cell+grow,B+8);
    }
    ctx.globalCompositeOperation='source-over';
  }

  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.t+=dt*0.05;
    if(w.t<0) continue;
    if(w.t>=1){ waves.splice(i,1); continue; }
    ctx.globalAlpha=(1-w.t)*0.5; ctx.strokeStyle='#fff';
    ctx.lineWidth=Math.max(1,cell*0.14*(1-w.t));
    ctx.beginPath(); ctx.arc(w.x,w.y,easeOutCubic(w.t)*B*0.62,0,6.283); ctx.stroke();
    ctx.globalAlpha=1;
  }

  for(let i=0;i<3;i++){
    const t=tray[i]; if(!t) continue;
    if(drag&&drag.i===i) continue;
    if(ret&&ret.i===i) continue;
    const R=slotRect(i),s=t.s;
    const bob=reduce?0:Math.sin(now*0.0022+i*2.1)*cell*0.045;
    const tc=trayFit(s), ox=R.x+(R.w-s.cols*tc)/2, oy=R.y+(R.h-s.rows*tc)/2+bob;
    const gold=t.gi===GOLD;
    if(gold) goldGlow(ox+s.cols*tc/2,oy+s.rows*tc/2,Math.max(s.cols,s.rows)*tc*0.95+tc*0.6,now,i);
    if(s.star) goldGlow(ox+tc/2,oy+tc/2,tc*1.5,now,i,'235,225,255');
    const pulse=s.star&&!reduce?1+0.08*Math.sin(now*0.004+i*2):1;         // star breathes gently
    let tp=1, trSrc;                                                     // tray flips after the board, staggered per slot
    if(flip){
      const delay=FLIP_WAVE+FLIP_CELL+FLIP_GAP+i*FLIP_STAGGER;
      tp=clamp((flip.t-delay)/FLIP_TRAY,0,1);
      if(tp<1){ const half=tp<0.5; if(half) trSrc={big:flip.fromBig,small:flip.fromSmall}; }
    }
    const tsq=tp<1?(tp<0.5?1-tp*2:(tp-0.5)*2):1;
    for(const [dr,dc] of s.cells)
      gem(t.gi,ox+dc*tc,oy+dr*tc,tc,pulse*tsq,1,gold?goldShimmer(now,s,dr,dc):0,true,pulse,trSrc);
  }

  if(ret){
    ret.t=Math.min(1,ret.t+dt*0.1);
    const e=easeOutBack(ret.t), t=tray[ret.i];
    if(t){
      const x=ret.fx+(ret.tx-ret.fx)*e, y=ret.fy+(ret.ty-ret.fy)*e, sz=ret.fs+(ret.ts-ret.fs)*e;
      for(const [dr,dc] of t.s.cells) gem(t.gi,x+dc*sz,y+dr*sz,sz,1,1,0,sz<cell*0.8);
    }
    if(ret.t>=1) ret=null;
  }

  if(drag&&tray[drag.i]){
    const t=tray[drag.i],s=t.s;
    drag.g=Math.min(1,drag.g+dt*0.14);
    const sc=1+0.09*easeOutBack(drag.g);
    const gold=t.gi===GOLD;
    ctx.save();
    ctx.translate(drag.x,drag.y-cell*CFG.LIFT);
    ctx.rotate(clamp(drag.vx*0.011,-.2,.2)); ctx.scale(sc,sc);
    if(gold) goldGlow(0,0,Math.max(s.cols,s.rows)*cell*0.95+cell*0.6,now,0);
    else if(s.star) goldGlow(0,0,cell*1.5,now,0,'235,225,255');
    const ox=-(s.cols*cell)/2, oy=-(s.rows*cell)/2;
    if(!drag.shadow) drag.shadow=pieceShadow(s);                 // blurred once per drag, not every frame
    ctx.drawImage(drag.shadow.cv,ox-drag.shadow.pad,oy-drag.shadow.pad+8,drag.shadow.w,drag.shadow.h);
    for(const [dr,dc] of s.cells) gem(t.gi,ox+dc*cell,oy+dr*cell,cell,1,1,gold?goldShimmer(now,s,dr,dc):0);
    ctx.restore();
  }

  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt*0.017;
    if(p.t>=1){ pops.splice(i,1); continue; }
    const sc=0.5+0.5*easeOutBack(Math.min(1,p.t*3.2));
    const rise=easeOutCubic(p.t)*cell*1.5, a=1-Math.pow(p.t,2.6);
    const fs=Math.round(cell*0.62*(1+0.14*Math.min(4,(p.lines||1)-1)));
    ctx.font='700 '+fs+'px "Fredoka",Verdana,sans-serif';
    const half=ctx.measureText(p.txt).width/2+fs*0.2;            // keep a popup from an edge column on screen
    ctx.save(); ctx.translate(clamp(p.x,half+6,W-half-6),p.y-rise); ctx.scale(sc,sc);
    ctx.globalAlpha=a; ctx.textAlign='center'; ctx.lineJoin='round';
    ctx.lineWidth=fs*0.18; ctx.strokeStyle='rgba(24,8,40,.85)'; ctx.strokeText(p.txt,0,0);
    ctx.fillStyle=p.combo>3?'#FF7BD5':p.combo>1?'#FFD45C':'#FFFFFF';
    ctx.fillText(p.txt,0,0);
    if(p.sub){
      const ss=Math.round(cell*0.3);
      ctx.font='700 '+ss+'px "Fredoka",Verdana,sans-serif';
      ctx.lineWidth=ss*0.28; ctx.strokeText(p.sub,0,cell*0.44);
      ctx.fillStyle='#fff'; ctx.fillText(p.sub,0,cell*0.44);
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  for(let i=bursts.length-1;i>=0;i--){             // praise stars
    const b=bursts[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=Math.pow(.94,dt); b.vy=b.vy*Math.pow(.94,dt)+0.04*dt; b.life-=dt*0.022;
    if(b.life<=0){ bursts.splice(i,1); continue; }
    const r=b.r*(0.5+0.5*b.life);
    ctx.globalAlpha=Math.min(1,b.life*1.6); ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.moveTo(b.x,b.y-r);
    ctx.quadraticCurveTo(b.x,b.y,b.x+r,b.y); ctx.quadraticCurveTo(b.x,b.y,b.x,b.y+r);
    ctx.quadraticCurveTo(b.x,b.y,b.x-r,b.y); ctx.quadraticCurveTo(b.x,b.y,b.x,b.y-r); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=praises.length-1;i>=0;i--){            // the praise word: pops in, holds, lifts away
    const p=praises[i]; p.t+=dt*0.019;
    if(p.t>=1){ praises.splice(i,1); continue; }
    const pin=Math.min(1,p.t/0.2), out=p.t>0.72?(p.t-0.72)/0.28:0;
    let size=Math.round(Math.min(W*0.13,cell*1.1)*(1+0.1*(p.tier-1)));
    ctx.save();
    ctx.font='700 '+size+'px "Fredoka",Verdana,sans-serif';
    const fit=Math.min(1,W*0.88/ctx.measureText(p.word).width);   // long words shrink to fit the screen
    const sc=(reduce?1:0.3+0.7*easeOutBack(pin))*fit;
    ctx.translate(W/2,by+B*0.3-out*cell*0.9);
    if(!reduce) ctx.rotate(Math.sin(p.t*18)*0.05*(1-pin));
    ctx.scale(sc,sc);
    ctx.globalAlpha=1-out; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    ctx.lineWidth=size*0.3; ctx.strokeStyle=p.b; ctx.globalAlpha=(1-out)*0.35; ctx.strokeText(p.word,0,0);  // soft coloured halo
    ctx.globalAlpha=1-out;
    ctx.lineWidth=size*0.16; ctx.strokeStyle='rgba(28,8,46,.92)'; ctx.strokeText(p.word,0,0);
    const g=ctx.createLinearGradient(0,-size*0.45,0,size*0.45);
    g.addColorStop(0,'#FFFFFF'); g.addColorStop(0.28,p.a); g.addColorStop(1,p.b);
    ctx.fillStyle=g; ctx.fillText(p.word,0,0);
    ctx.restore();
  }

  for(let i=banners.length-1;i>=0;i--){
    const b=banners[i]; b.t+=dt*0.013;
    if(b.t>=1){ banners.splice(i,1); continue; }
    if(b.t<0) continue;
    const sc=0.6+0.4*easeOutBack(Math.min(1,b.t*2.4));
    const a=b.t>0.72?(1-b.t)/0.28:1;
    ctx.save(); ctx.translate(W/2,by+B/2); ctx.scale(sc,sc);
    ctx.globalAlpha=a; ctx.textAlign='center'; ctx.lineJoin='round';
    const bs=Math.round(Math.min(W*0.13,62));
    ctx.font='700 '+bs+'px "Fredoka",Verdana,sans-serif';
    const bfit=Math.min(1,W*0.9/ctx.measureText(b.txt).width); ctx.scale(bfit,bfit);
    ctx.globalAlpha=a*0.3; ctx.lineWidth=bs*0.34; ctx.strokeStyle='#FFB020'; ctx.strokeText(b.txt,0,0);
    ctx.globalAlpha=a; ctx.lineWidth=bs*0.16; ctx.strokeStyle='rgba(40,14,50,.92)'; ctx.strokeText(b.txt,0,0);
    ctx.fillStyle='#FFD45C'; ctx.fillText(b.txt,0,0);
    const ss=Math.round(Math.min(W*0.07,34));
    ctx.font='700 '+ss+'px "Fredoka",Verdana,sans-serif';
    ctx.lineWidth=ss*0.22; ctx.strokeText(b.sub,0,Math.min(W*0.1,48));
    ctx.fillStyle='#fff'; ctx.fillText(b.sub,0,Math.min(W*0.1,48));
    ctx.restore(); ctx.globalAlpha=1;
  }

  ctx.restore();

  // foreground overlay — screen edges and an already-empty board only, never a live piece
  if(CFG.FX_COMBO_GLOW && comboGlowV>0.02) edgeGlow(combo>4?'255,123,213':'255,212,92',comboGlowV);
  if(CFG.FX_SWEEP_FX) stepConfetti(dt);
}

/* ═══════ flow ═══════ */
async function gameOver(){
  if(state!=='play') return;
  if(paused){ setTimeout(gameOver,300); return; }
  state='over';
  const prevBest=best;
  best=Math.max(best,score); el('bestVal').textContent=best;
  const newSkins=checkUnlocks();
  deaths++;
  if(deaths%CFG.ADS_EVERY===0) await Ads.showInterstitial();
  el('overScore').textContent=score;
  el('overMsg').textContent=(newSkins.length?'New skin unlocked: '+newSkins.join(', ')+'! ':'')
    +(score>=1500?'That is a serious run.'
    :score>=600?'Good chains. Save the big shapes for open space.'
    :'Clear rows early — do not let the board fill up.');
  const btn=el('reviveBtn');
  const canRescue=rescuesUsed<CFG.MAX_RESCUES
    && (score>=CFG.RESCUE_FLOOR || score>=prevBest*CFG.RESCUE_BEST_FRAC) && score>0;
  btn.hidden=!canRescue;
  btn.textContent=rescues>0?'Use a rescue':'Watch an ad for a rescue';
  el('overCard').hidden=false;
}
async function rescue(){
  if(rescuesUsed>=CFG.MAX_RESCUES) return;
  if(rescues<=0){
    if(!await Ads.showRewarded()) return;
    rescues++;
  }
  rescues--; rescuesUsed++;
  waves.push({x:W/2,y:by+B/2,t:0}); glowT=1;
  Sfx.rescue();
  combo=0; tension=0.5; goldenNext=false; genRescue();
  el('overCard').hidden=true; state='play';
}
function start(){
  layout();
  grid=empty(); score=0; combo=0; rescues=CFG.FREE_RESCUES; rescuesUsed=0; tension=0; sweepCool=0; trayNo=0; carry=[];
  golden=null; goldenNext=false; goldenCool=0; trayHadSweep=false; trayCombo=0; starForced=false;
  shatters=[];shards=[];pops=[];sweeps=[];waves=[];sparkles=[];banners=[];blasts=[];drag=null;ret=null;
  praises=[];bursts=[];lineFlashes=[];
  confetti=[]; comboGlowV=0; goldTintV=0; sweepFxT=0; punchT=0;
  resetWorld();
  el('scoreVal').textContent='0'; el('bestVal').textContent=best;
  genTray(); el('startCard').hidden=true; el('overCard').hidden=true; state='play';
}
/* ═══════ skins + worlds — unlockable/discoverable, persisted in localStorage ═══════ */
const SKIN_STORE='crumble.skins';
const PICKABLE_SKINS=SKINS.filter(s=>!s.event);       // transformation skins never appear here
let unlocked=new Set(SKINS.filter(s=>s.unlock<=0 && !s.event).map(s=>s.id));
function isUnlocked(id){ return CFG.UNLOCK_ALL || unlocked.has(id); }
function isWorldUnlocked(id){ return !TRANSFORMS[id] || CFG.UNLOCK_ALL_WORLDS || discoveredWorlds.has(id); }
function saveSkinSave(){
  try{ localStorage.setItem(SKIN_STORE,JSON.stringify({
    unlocked:[...unlocked], style:CFG.STYLE, motif:CFG.MOTIF,
    homeWorld:CFG.HOME_WORLD, discovered:[...discoveredWorlds]
  })); }catch(e){}
}
function loadSkinSave(){
  try{
    const o=JSON.parse(localStorage.getItem(SKIN_STORE)||'{}');
    if(Array.isArray(o.unlocked)) o.unlocked.forEach(id=>{ if(SKINS.some(s=>s.id===id)) unlocked.add(id); });
    if(Array.isArray(o.discovered)) o.discovered.forEach(id=>{ if(TRANSFORMS[id]) discoveredWorlds.add(id); });
    if(typeof o.style==='string' && unlocked.has(o.style)) CFG.STYLE=o.style;
    if(typeof o.motif==='string' && MOTIFS.some(m=>m.id===o.motif)) CFG.MOTIF=o.motif;
    if(typeof o.homeWorld==='string' && isWorldUnlocked(o.homeWorld)
      && (HOME_WORLDS.some(w=>w.id===o.homeWorld)||TRANSFORMS[o.homeWorld])) CFG.HOME_WORLD=o.homeWorld;
  }catch(e){}
}
// call whenever `best` changes; returns the names of any skins newly earned
function checkUnlocks(){
  const news=[];
  for(const s of PICKABLE_SKINS) if(!unlocked.has(s.id) && best>=s.unlock){ unlocked.add(s.id); news.push(s.name); }
  if(news.length){ saveSkinSave(); renderSkins(); }
  return news;
}
function setSkin(id){ if(!isUnlocked(id)) return; CFG.STYLE=id; curSkin=id; buildCache(); renderSkins(); saveSkinSave(); }
function setMotif(id){ CFG.MOTIF=id; buildCache(); renderMotifs(); saveSkinSave(); }
function setWorld(id){
  if(!isWorldUnlocked(id)) return;
  CFG.HOME_WORLD=id; curWorld=id;
  ambient=spawnAmbient(worldDef(id).effect); ambientOld=[]; bgFrom=id; bgT=1;
  renderWorlds(); saveSkinSave();
}
function renderSkins(){
  el('skinGrid').querySelectorAll('button').forEach(b=>{
    const s=SKINS.find(x=>x.id===b.dataset.id), ok=isUnlocked(s.id);
    b.disabled=!ok; b.setAttribute('aria-pressed',String(CFG.STYLE===s.id));
    const old=b.querySelector('.lock'); if(old) old.remove();
    if(!ok){ const l=document.createElement('span'); l.className='lock'; l.textContent=s.unlock+' pts'; b.append(l); }
  });
}
function renderMotifs(){
  el('motifRow').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(CFG.MOTIF===b.dataset.id)));
}
// (re)builds the world grid — called at init and again whenever a new one is discovered
function renderWorlds(){
  const grid=el('worldGrid');
  grid.innerHTML='';
  const list=[...HOME_WORLDS, ...TRANSFORM_IDS.filter(isWorldUnlocked).map(id=>({id,name:TRANSFORMS[id].name}))];
  list.forEach(wDef=>{
    const b=document.createElement('button');
    b.className='skin-btn'; b.type='button'; b.dataset.id=wDef.id;
    b.append(Object.assign(document.createElement('span'),{textContent:wDef.name}));
    b.setAttribute('aria-pressed',String(CFG.HOME_WORLD===wDef.id));
    b.onclick=e=>{ e.stopPropagation(); setWorld(wDef.id); };
    grid.append(b);
  });
}
function buildSkinsUI(){
  const grid=el('skinGrid');
  PICKABLE_SKINS.forEach(s=>{
    const b=document.createElement('button');
    b.className='skin-btn'; b.type='button'; b.dataset.id=s.id;
    b.append(Object.assign(document.createElement('span'),{textContent:s.name}));
    b.onclick=e=>{ e.stopPropagation(); setSkin(s.id); };
    grid.append(b);
  });
  const row=el('motifRow');
  MOTIFS.forEach(m=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=m.name; b.dataset.id=m.id;
    b.onclick=e=>{ e.stopPropagation(); setMotif(m.id); };
    row.append(b);
  });
  renderWorlds(); renderSkins(); renderMotifs();
}
el('startBtn').onclick=e=>{e.stopPropagation();ac();start();};
el('againBtn').onclick=e=>{e.stopPropagation();start();};
el('reviveBtn').onclick=e=>{e.stopPropagation();rescue();};

/* ═══════ developer panel ═══════
   Everything is driven by the two tables below — a new toggle or slider is one line. */
const DEV_TOGGLES=[            // [CFG key, label]
  ['GOLDEN_ENABLED','Golden Hand'],
  ['STAR_ENABLED','Star Gem'],
  ['TRANSFORM_ENABLED','Transformations'],
  ['UNLOCK_ALL','Unlock all skins'],
  ['UNLOCK_ALL_WORLDS','Unlock all worlds'],
  ['FX_COMBO_GLOW','Combo edge glow'],
  ['FX_GOLD_TINT','Gold screen tint'],
  ['FX_SWEEP_FX','Sweep wash + confetti'],
  ['FX_TENSION_BORDER','Tension border glow'],
  ['FX_PUNCH_ZOOM','Punch zoom on clears'],
  ['SHOW_TENSION','Debug readout']
];
// instant-trigger buttons for testing — each just calls triggerTransform(id)
const DEV_ACTIONS=Object.keys(TRANSFORMS).map(id=>[TRANSFORMS[id].name,()=>{ transformCool=0; triggerTransform(id); }]);
const SOUND_OPTIONS=[{value:'plastic',label:'Plastic'},{value:'wood',label:'Wood'},{value:'magnet',label:'Magnet'}];
const DEV_CHOICES=[            // [CFG key, label, options, audition fn]
  ['SND_PICKUP','Pickup sound',SOUND_OPTIONS,()=>{ ac(); Sfx.pickup(); }],
  ['SND_PLACE','Place sound',SOUND_OPTIONS,()=>{ ac(); Sfx.place(1); }]
];
const DEV_SLIDERS=[            // [CFG key, label, min, max, step]
  ['SND_PICKUP_VOL','Pickup volume',0,1.5,0.05],
  ['SND_PLACE_VOL','Place volume',0,1.5,0.05],
  ['TRANSFORM_PLACEMENTS','Transform length (placements)',1,15,1],
  ['TRANSFORM_MULT','Transform score multiplier',1,4,0.1],
  ['TRANSFORM_COOLDOWN','Transform cooldown (trays)',0,15,1],
  ['MYSTERY_CHANCE','Mystery trigger chance (per tray)',0,0.3,0.01],
  ['TENSION_UP','Tension up (no clear)',0,0.5,0.01],
  ['TENSION_DOWN','Tension down (clear)',0,0.5,0.01],
  ['TENSION_DRIFT','Tension drift (cramped)',0,0.3,0.01],
  ['TIER_SOLVABLE','Tier: solvable above',0,1,0.01],
  ['TIER_JACKPOT','Tier: jackpot above',0,1,0.01],
  ['TIER_SWEEP','Tier: sweep above',0,1,0.01],
  ['SMALL_BIAS','Small-piece bias',0,8,0.1],
  ['SINGLE_WEIGHT','Single-cell weight',0,1,0.05],
  ['TIDY','Tidiness',0,5,0.1],
  ['PAIR_CHANCE','Partner-piece chance',0,1,0.05],
  ['GOLDEN_COMBO','Golden hand at combo',1,10,1],
  ['GOLDEN_CHANCE','Golden hand chance (per tray)',0,0.5,0.01],
  ['GOLDEN_COOLDOWN','Golden hand cooldown (trays)',0,10,1],
  ['GOLDEN_MULT','Golden multiplier (found it)',1,6,0.5],
  ['GOLDEN_PARTIAL','Golden multiplier (partial)',1,4,0.5],
  ['STAR_CHANCE','Star gem chance (per tray)',0,0.5,0.01],
  ['STAR_COMBO','Star gem guaranteed at combo',2,10,1],
  ['SWEEP_COOLDOWN','Sweep cooldown (trays)',0,10,1],
  ['SNAP_RADIUS','Snap radius (cells)',0,3,1],
  ['SNAP_STICKY','Snap stickiness',0,1.5,0.05],
  ['LIFT','Piece lift (cells)',0,3,0.05]
];
const DEV_KEYS=[...DEV_TOGGLES.map(t=>t[0]),...DEV_CHOICES.map(c=>c[0]),...DEV_SLIDERS.map(s=>s[0])];
const DEV_DEFAULTS=Object.fromEntries(DEV_KEYS.map(k=>[k,CFG[k]]));   // the values written in the file
const DEV_STORE='crumble.dev';
function devSave(){
  try{ localStorage.setItem(DEV_STORE,JSON.stringify(Object.fromEntries(DEV_KEYS.map(k=>[k,CFG[k]])))); }catch(e){}
}
function devLoad(){
  try{
    const o=JSON.parse(localStorage.getItem(DEV_STORE)||'{}');
    for(const k of DEV_KEYS) if(typeof o[k]===typeof DEV_DEFAULTS[k]) CFG[k]=o[k];
  }catch(e){}
}
function devSnippet(){
  const f=v=>typeof v==='number'?+v.toFixed(4):typeof v==='string'?JSON.stringify(v):v;
  return '// dev panel snapshot — paste over the matching CFG entries\n'+DEV_KEYS.map(k=>`  ${k}: ${f(CFG[k])},`).join('\n');
}
function initDev(){
  el('devBtn').hidden=!CFG.DEV_MODE;
  if(!CFG.DEV_MODE) return;
  devLoad();
  const list=el('devList'), refresh=[];
  const make=(tag,cls)=>{ const n=document.createElement(tag); if(cls) n.className=cls; return n; };
  for(const [k,label] of DEV_TOGGLES){
    const row=make('label','tog'), name=make('span'), inp=make('input');
    name.textContent=label; inp.type='checkbox';
    inp.onchange=()=>{
      CFG[k]=inp.checked; devSave(); updateDbg();
      if(k==='UNLOCK_ALL') renderSkins();
      if(k==='UNLOCK_ALL_WORLDS') renderWorlds();
    };
    refresh.push(()=>{ inp.checked=!!CFG[k]; });
    row.append(name,inp); list.append(row);
  }
  const actions=make('div','devbtns');
  for(const [label,fn] of DEV_ACTIONS){
    const b=make('button','ghost'); b.type='button'; b.textContent=label;
    b.onclick=e=>{ e.stopPropagation(); fn(); };
    actions.append(b);
  }
  list.append(actions);
  const soundHead=make('div','devhead'); soundHead.textContent='Sound'; list.append(soundHead);
  for(const [k,label,options,audition] of DEV_CHOICES){
    const box=make('div'), head=make('div','head'), name=make('span'), row=make('div','choices');
    name.textContent=label; head.append(name); box.append(head);
    const btns=options.map(o=>{
      const b=make('button'); b.type='button'; b.textContent=o.label;
      b.onclick=e=>{ e.stopPropagation(); CFG[k]=o.value; devSave(); btns.forEach(x=>x.setAttribute('aria-pressed',String(x===b))); };
      row.append(b); return b;
    });
    const play=make('button','play'); play.type='button'; play.textContent='▶';
    play.setAttribute('aria-label','Play '+label);
    play.onclick=e=>{ e.stopPropagation(); audition(); };
    row.append(play);
    box.append(row); list.append(box);
    refresh.push(()=>{ btns.forEach((b,i)=>b.setAttribute('aria-pressed',String(CFG[k]===options[i].value))); });
  }
  for(const [k,label,min,max,step] of DEV_SLIDERS){
    const box=make('div'), head=make('div','head'), name=make('span'), out=make('output'), inp=make('input');
    const dp=(String(step).split('.')[1]||'').length;
    name.textContent=label;
    Object.assign(inp,{type:'range',min,max,step});
    const show=()=>{ out.textContent=(+CFG[k]).toFixed(dp); };
    inp.oninput=()=>{ CFG[k]=+inp.value; show(); devSave(); };
    refresh.push(()=>{ inp.value=CFG[k]; show(); });
    head.append(name,out); box.append(head,inp); list.append(box);
  }
  const sync=()=>refresh.forEach(f=>f());
  el('devBtn').onclick=e=>{
    e.stopPropagation();
    paused=true; drag=null; shake=0;          // freeze the game while the panel is up
    sync(); el('devPanel').hidden=false;
  };
  el('devClose').onclick=e=>{ e.stopPropagation(); el('devPanel').hidden=true; paused=false; };
  el('devReset').onclick=e=>{
    e.stopPropagation();
    Object.assign(CFG,DEV_DEFAULTS);
    try{ localStorage.removeItem(DEV_STORE); }catch(_){}
    sync(); updateDbg(); renderSkins(); renderWorlds();
  };
  el('devCopy').onclick=async e=>{
    e.stopPropagation();
    const txt=devSnippet(), btn=e.currentTarget;
    try{ await navigator.clipboard.writeText(txt); }
    catch(_){
      const ta=document.createElement('textarea'); ta.value=txt; document.body.append(ta); ta.select();
      try{ document.execCommand('copy'); }catch(__){}
      ta.remove();
    }
    btn.textContent='Copied!'; setTimeout(()=>{ btn.textContent='Copy settings'; },1200);
  };
}
loadSkinSave(); buildSkinsUI();
initDev();

layout(); grid=empty(); resetWorld(); genTray(); updateDbg(); requestAnimationFrame(frame);
})();
</script>
