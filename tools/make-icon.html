<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crumble icon</title>
<style>
  body{margin:0;padding:24px;background:#222;color:#ddd;font:14px/1.4 -apple-system,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:14px}
  canvas{width:min(80vmin,512px);height:auto;aspect-ratio:1;background:#000;border-radius:0}
  button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#FFC12E;color:#222;font-weight:600;cursor:pointer}
  p{margin:0;max-width:52ch;text-align:center;opacity:.8}
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<p>Right-click the icon and choose “Save Image As…” for the 1024×1024 PNG.</p>
<button id="exp">Export 180, 167, 152, 120</button>

<script>
/* ── copied verbatim from index.html — keep in sync if the gem look changes ── */
const dpr=1;                                   // tiles are drawn at exact pixel size here
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const GEMS=[
  {h:344,s:88},{h: 32,s:96},{h:150,s:72},
  {h:188,s:85},{h:226,s:88},{h:278,s:82}
];
function roundPath(x,px,py,w,h,r){
  const k=Math.min(r,w/2,h/2);
  x.beginPath(); x.moveTo(px+k,py);
  x.arcTo(px+w,py,px+w,py+h,k); x.arcTo(px+w,py+h,px,py+h,k);
  x.arcTo(px,py+h,px,py,k); x.arcTo(px,py,px+w,py,k); x.closePath();
}
function newTile(size){
  const cv=document.createElement('canvas');
  const px=Math.max(10,Math.round(size*dpr));
  cv.width=cv.height=px;
  const x=cv.getContext('2d'); x.scale(px/size,px/size);
  return {cv,x};
}
// Hard facets: lit top, shadowed bottom, angled sides, specular.
function jewelTile(size,g){
  const {cv,x}=newTile(size);
  const L=d=>`hsl(${g.h} ${g.s}% ${clamp(57+d,5,96)}%)`;
  const pad=size*0.055, S=size-pad*2, i=S*0.25;
  const o=[[pad,pad],[pad+S,pad],[pad+S,pad+S],[pad,pad+S]];
  const n=[[pad+i,pad+i],[pad+S-i,pad+i],[pad+S-i,pad+S-i],[pad+i,pad+S-i]];
  x.save(); roundPath(x,pad,pad,S,S,S*0.25); x.clip();
  x.fillStyle=L(0); x.fillRect(pad,pad,S,S);
  const face=(a,b,c,d,dl)=>{ x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]);
    x.lineTo(c[0],c[1]); x.lineTo(d[0],d[1]); x.closePath(); x.fillStyle=L(dl); x.fill(); };
  face(o[0],o[1],n[1],n[0],24); face(o[3],o[0],n[0],n[3],7);
  face(o[1],o[2],n[2],n[1],-13); face(o[2],o[3],n[3],n[2],-27);
  const gr=x.createLinearGradient(n[0][0],n[0][1],n[2][0],n[2][1]);
  gr.addColorStop(0,L(18)); gr.addColorStop(1,L(-5));
  x.fillStyle=gr; x.fillRect(n[0][0],n[0][1],S-i*2,S-i*2);
  x.globalAlpha=.5; x.fillStyle='#fff';
  roundPath(x,pad+S*0.3,pad+S*0.29,S*0.22,S*0.13,S*0.065); x.fill();
  x.globalAlpha=1; x.restore();
  roundPath(x,pad,pad,S,S,S*0.25);
  x.strokeStyle=L(26); x.lineWidth=Math.max(1,size*0.035); x.stroke();
  return cv;
}

/* ── icon composition (2026-11 rebrand): the three gems, Crumb on top, the travelling sky behind ── */
const SIZE=1024, TILE=400;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

// Crumb, as in js/mascot.js (MASCOT_SVG) with the styles from index.html written inline: happy face, arms up
const CRUMB=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="960" height="960">
<g fill="#7A4A22"><rect x="16" y="38.5" width="5.5" height="5" rx="2.4"/><rect x="26.5" y="38.5" width="5.5" height="5" rx="2.4"/></g>
<g fill="none" stroke="#6E4220" stroke-width="2.2" stroke-linecap="round"><path d="M10.5 23 L5 15.5"/><path d="M37.5 23 L43 15.5"/></g>
<path d="M10 20.5C9.5 13 15.5 6.5 23.5 6.5c3 0 4.5 1.4 6.5.6 4.6-.8 8.6 4 9 9.4.3 2.3-1.2 3.6.4 6.1 1.4 3.4.4 9.3-4 12.6-4.4 3.6-13.4 4.3-19.4 1.3C10.3 34 8.4 30 9.3 26.7c.6-2.2 1.1-3.5.7-6.2z" fill="#D9A05B" stroke="#6E4220" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M14 15.5c1.5-4.6 5.6-6.8 9.4-6.6" fill="none" stroke="#F2CE92" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
<g fill="#5B3417"><ellipse cx="14.6" cy="31.6" rx="2" ry="1.6"/><ellipse cx="33.4" cy="32.4" rx="1.7" ry="1.5"/><ellipse cx="35.2" cy="12.6" rx="1.5" ry="1.3"/><circle cx="24" cy="36" r=".9"/><circle cx="12.4" cy="25" r=".7"/></g>
<ellipse cx="18.6" cy="21.4" rx="3.6" ry="4.2" fill="#fff" stroke="#6E4220" stroke-width=".8"/><ellipse cx="29.4" cy="21.4" rx="3.6" ry="4.2" fill="#fff" stroke="#6E4220" stroke-width=".8"/>
<g fill="#24150B"><circle cx="18.9" cy="22" r="1.9"/><circle cx="29.7" cy="22" r="1.9"/></g><g fill="#fff"><circle cx="19.7" cy="21.2" r=".6"/><circle cx="30.5" cy="21.2" r=".6"/></g>
<g transform="translate(0 -1.6)" fill="none" stroke="#3E230E" stroke-width="2" stroke-linecap="round"><path d="M15 15.6 21.8 15.2"/><path d="M26.2 15.2 33 15.6"/></g>
<path d="M19.6 28.2q4.4 0 8.8 0q-.4 5.4-4.4 5.4t-4.4-5.4z" fill="#3A2010" stroke="#3A2010" stroke-width="1.6" stroke-linejoin="round"/>
</svg>`;

async function drawIcon(){
  // background: the journey sky in one picture, space at the top down to dawn at the bottom
  const bg=ctx.createLinearGradient(0,0,0,SIZE);
  for(const [o,c] of [[0,'#0E0B2E'],[.32,'#3A1F6E'],[.6,'#B8457F'],[.82,'#FF8A4C'],[1,'#FFD466']]) bg.addColorStop(o,c);
  ctx.fillStyle=bg; ctx.fillRect(0,0,SIZE,SIZE);
  let sd=9; const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;      // the same stars every time
  ctx.fillStyle='#fff';
  for(let i=0;i<44;i++){ ctx.globalAlpha=.3+rnd()*.6; ctx.beginPath(); ctx.arc(rnd()*SIZE,rnd()*430,1.5+rnd()*4,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  // ruby (back left), citrine (back right), aqua (front, bottom centre)
  const gems=[
    {g:GEMS[0], x:380, y:480, rot:-13},
    {g:GEMS[1], x:640, y:500, rot:11},
    {g:GEMS[3], x:512, y:700, rot:-4}
  ];
  for(const {g,x,y,rot} of gems){
    const tile=jewelTile(TILE,g);
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot*Math.PI/180);
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=40; ctx.shadowOffsetY=14;
    ctx.drawImage(tile,-TILE/2,-TILE/2,TILE,TILE);
    ctx.restore();
  }

  // Crumb, standing on the back gems
  const im=new Image(); im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(CRUMB); await im.decode();
  const S=360;
  ctx.save(); ctx.translate(520,345); ctx.rotate(4*Math.PI/180);
  ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=26; ctx.shadowOffsetY=10;
  ctx.drawImage(im,-S/2,-S*.9,S,S);
  ctx.restore();
  window.iconReady=true;
}
drawIcon();

document.getElementById('exp').onclick=async()=>{
  for(const s of [180,167,152,120]){
    const o=document.createElement('canvas'); o.width=o.height=s;
    const x=o.getContext('2d'); x.imageSmoothingQuality='high';
    x.drawImage(cv,0,0,s,s);
    const blob=await new Promise(r=>o.toBlob(r,'image/png'));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='icon-'+s+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r=>setTimeout(r,250));   // spacing so the browser doesn't drop downloads
  }
};
</script>
</body>
</html>
